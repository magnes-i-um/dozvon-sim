function pickTurn(client,text){
  const n=norm(text);
  for(const t of client.turns){
    if(t.k.split('|').some(w=>n.includes(norm(w)))) return t;
  }
  return null;
}
/* Послабление фолбэка (механика 7): этап зачитывается по ключам, предметке или структуре */
function fallbackStageCredit(text,turn,mood){
  if(turn)return turn.s;
  const n=norm(text);
  const subject=/\d|отсрочк|неустойк|sla|склад|резерв|наличи|сезон|размерност|отгрузк|брак|простой|выборк|спецификац|инн/.test(n);
  if(subject)return 2;
  if(isOpenQuestion(text))return 1;
  if(RE.ack.test(n)&&isQuestion(text))return 3;
  if(RE.nextStep.test(n))return 4;
  return null;
}
function clientReply(turn,client,mood,engine){
  if(engine==='fallback'){
    if(!turn)return {txt:client.evasive[Math.floor(Math.random()*client.evasive.length)],fb:true};
    return {txt:turn.fb||turn.llm,fb:true};
  }
  if(!turn)return {txt:client.evasive[Math.min(2,client.evasive.length-1)],fb:false};
  let t=turn.llm;
  if(mood<30){ /* тон подстраивается под настрой: ниже — суше и короче */
    const first=t.split(/(?<=[.?!])\s/)[0];
    t=first||t;
  }else if(mood>70&&client.type==='Эмоционал'){
    t=t+' Спасибо, что вы меня слышите!';
  }
  return {txt:t,fb:false};
}

/* ======================= 10. ФОРМУЛЫ БАЛЛА (раздел 04) ================== */
function scoreCriterion(key,raw,crit){
  const st=raw;
  switch(key){
    case 'ack':        return st.ack?95:20;
    case 'research':   {
      const sum = st.fallbackMode ? st.qAny : st.openQ + st.closedQ*0.5;
      return Math.min(100, Math.round(22*(sum + (st.truth?1:0))));
    }
    case 'answer':     return st.llmTurns===0 ? null : (st.answerLinked?88:30);
    case 'balance':    {
      const share=st.managerShare;
      if(share>=22&&share<=42)return 100;
      if(share<22)return 78;
      return Math.max(30, Math.round(100-(share-42)*3));
    }
    case 'interrupt':  return st.interruptions===0?100:st.interruptions===1?70:st.interruptions===2?45:20;
    case 'close':      return st.nextStep?96:25;
    case 'tools':      return st.llmTurns===0 ? null : Math.min(100, 25*st.llmToolsCount);
    default:return 0;
  }
}
/* Взвешенное среднее по включённым критериям; выключенный выпадает из знаменателя */
function computeScore(raw){
  let sum=0,wsum=0,rows=[];
  S.criteria.forEach(c=>{
    if(!c.enabled)return;
    const val=scoreCriterion(c.key,raw,c);
    if(val===null)return;                     /* критерий не применим: 0 LLM-ходов */
    rows.push({...c,v:val});
    sum+=val*c.w; wsum+=c.w;
  });
  const score = wsum? Math.round(sum/wsum) : 0;
  return {score,rows};
}
function grade(score){return score>=85?'Отлично':score>=70?'Хорошо':score>=55?'Достаточно':'Требует доработки'}
/* Единая шкала прототипа: проходной балл 50. Ниже — жёлтый, от проходного — зелёный (ОС куратора). */
const PASS=50;                                   /* барьер цвета по умолчанию */
function passMark(){return (S&&S.pass)||PASS}     /* меняется методистом в админке */
/* Цвет — только визуальный ориентир: ниже барьера жёлтый, от барьера зелёный.
   Грейд при этом остаётся четырёхуровневым текстом со своим баллом. */
function valTone(v){return v>=passMark()?'ok':'warn'}
function gradeTone(score){return valTone(score)}

/* Пересчёт сохранённых сессий при изменении критериев (механика 21 ТЗ / п.14 В) */
function recalcAll(){
  let n=0;
  S.sessions.forEach(s=>{
    const r=computeScore(s.raw);
    if(r.score!==s.score||JSON.stringify(r.rows.map(x=>x.v))!==JSON.stringify((s.rows||[]).map(x=>x.v))){
      s.score=r.score; s.rows=r.rows; s.recalced=true; n++;
    }else{s.rows=r.rows}
    s.grade=gradeFor(s);
  });
  S.recalcCount++; save(); return n;
}
/* Грейд с учётом особых правил: срыв — не выше «Требует доработки» */
function gradeFor(s){
  let g=grade(s.score);
  if(s.status==='fail'){ if(s.score>=55) g='Требует доработки'; }
  return g;
}

function myStats(){
  /* в личную карточку идут только завершённые и сорванные звонки: прерванные не оценивают менеджера */
  const done=S.sessions.filter(s=>s.status!=='abort');
  const avg=done.length?Math.round(done.reduce((a,b)=>a+b.score,0)/done.length):0;
  const best={};
  done.forEach(s=>{best[s.clientId]=Math.max(best[s.clientId]||0,s.score)});
  return {avg,count:Object.keys(best).length,best,sessions:done.length};
}

function startCall(clientId){

  S.session={

    moodTraj:[{t:0,m:c.mood0}],turns:[{who:'cli',txt:c.prompt.first}],managerChars:0,clientChars:c.prompt.first.length,
    openQ:0,closedQ:0,qAny:0,interruptions:0,mistakes:[],tools:[],quickCount:0,managerTurns:0,llmTurns:0,llmToolsCount:0,llmTools:new Set(),
    answerLinked:false,nextStep:false,ack:false,truth:false,hints:0,fbTurns:0,pausedLog:0,streak:0,answerTexts:[],startedAt:Date.now(),
    usedTexts:[],useless:0,   /* usedTexts — уже звучавшие реплики: повтор не начисляет баллы; useless — холостые фразы (не тот этап / повтор) */
    clientTyping:false,hintOpen:false,fallbackNotice:false,marked:false,micHint:'',
    /* ИИ: спросили / модель ответила / взяли сценарий. Ноль — норма, не ошибка. */
    llmAsked:0,llmReplies:0,llmFallbacks:0,llmModel:'',llmTokens:0,llmTokensIn:0,llmTokensOut:0,llmCached:0,
    farewellStep:0,   /* 0 — разговор идёт · 1 — клиент попрощался · 2 — менеджер продолжил после прощания */
  };
  S.draft='';                       /* поле ввода всегда стартует пустым */
  S.screen='call';/* панель подсказки открывается сама только в десктопном виде: в режиме рамки она бы закрыла пульт */
  S.session.hintOpen=((S.device||'desktop')==='desktop'&&typeof matchMedia!=='undefined'&&matchMedia('(min-width:1041px)').matches);
  save();render();timerStart();speak(c.prompt.first);
  /* Локальная запись звонка: MediaRecorder в браузере — без сервера.
     Если доступа к микрофону нет, тренировка продолжается без записи (бейдж в разборе). */
  const sid=S.session.id;S.session.recState='starting';S.session.recNote='';
  recStart().then(r=>{
    const cur=S.session;
    if(cur&&cur.id===sid){cur.recState=r.ok?'on':'unavailable';cur.recNote=r.ok?'':(r.why||'');render()}
    else if(!r.ok&&RECORDER===null){} /* сессия уже закрыта — молча выходим */
    if(!r.ok)toast('Запись недоступна ('+r.why+'). Тренировка продолжается без аудио','bulb');
  });
  setTimeout(()=>toast('Соединение установлено · запись пошла','phone'),400);
}
function endCall(status){
  const s=S.session;if(!s)return;
  clearInterval(TIMER);
  const sid=s.id;
  s.status=status||'done';s.endedAt=Date.now();
  /* Останавливаем локальную запись: blob кладём в RECFILES и обновляем разбор.
     Серверное хранение (ENV.rec) подхватит этот же файл после подключения. */
  recStop(sid).then(blob=>{if(blob&&S.screen==='review'&&S.lastSessionId===sid)render()});
  const rec=finalize(s);
  S.sessions.unshift(rec);S.lastSessionId=rec.id;S.viewSessionId=null;S.session=null;save();
  if(status!=='abort')showLoader('review',1200);   /* анализ разбора после звонка (на сервере — LLM) */
  S.screen=status==='fail'?'sryv':status==='abort'?'review':'review';
  if(status==='fail'){S.failReason=rec.failReason||'';S.failSessionId=rec.id;beeps();}
  render();
}
function finalize(s){
  const totalChars=s.managerChars+s.clientChars||1;
  const managerShare=Math.round(s.managerChars/totalChars*100);
  const llmTurns=s.llmTurns;
  const raw={
    ack:s.ack, openQ:s.openQ, closedQ:s.closedQ, qAny:(s.fbTurns>0&&llmTurns===0)?s.qAny:s.openQ+s.closedQ, truth:s.truth,
    answerLinked:s.answerLinked, llmTurns, managerShare, interruptions:s.interruptions,
    nextStep:s.nextStep, llmToolsCount:s.llmToolsCount, tools:[...s.llmTools], fallbackMode:s.fbTurns>0&&llmTurns===0,
    useless:s.useless||0
  };
  const {score,rows}=computeScore(raw);
  const fbShare=Math.round(s.fbTurns/Math.max(1,s.managerTurns)*100);
  const quickShare=Math.round(s.quickCount/Math.max(1,s.managerTurns)*100);
  const rec={
    id:s.id,clientId:s.clientId,mode:s.mode,status:s.status,dur:s.t,moodStart:s.moodStart,moodEnd:Math.max(0,s.mood),
    moodTraj:s.moodTraj.slice(),stage:s.stage,turns:s.turns,raw,rows,score:0,grade:'',recalced:false,
    mistakes:s.mistakes.slice(),interruptions:s.interruptions,hints:s.hints,quickShare,tools:[...s.llmTools],
    fbShare,emergency:s.fbTurns>0,conditional:fbShare>50,templated:quickShare>50,
    recState:s.recState||'off',recNote:s.recNote||'',   /* состояние локальной записи: on | unavailable | off */
    /* ИИ: сколько реплик клиента написала модель и сколько раз брали сценарий.
       Нужно, чтобы методист видел, звонок был живым или по сценарию. */
    llmReplies:s.llmReplies||0,llmFallbacks:s.llmFallbacks||0,llmAsked:s.llmAsked||0,llmModel:s.llmModel||'',
    /* Расход по звонку: чтобы методист видел цену живого ИИ в токенах, а не на глаз */
    llmTokens:s.llmTokens||0,llmTokensIn:s.llmTokensIn||0,llmTokensOut:s.llmTokensOut||0,llmCached:s.llmCached||0,
    closedByClient:!!s.farewellStep,   /* разговор закрыл клиент, а не кнопка «Завершить» */
    date:new Date().toISOString(),failReason:s.failReason||'',linked:!!s.answerLinked
  };
  rec.score=score;rec.grade=gradeFor(rec);
  rec.quotes=buildQuotes(rec);
  return rec;
}
function buildQuotes(rec){
  const q=[];
  if(rec.raw.managerShare>42&&rec.raw.managerShare!==undefined)q.push(`Говорили ${rec.raw.managerShare}/${100-rec.raw.managerShare} — клиент так и не назвал свою боль`);
  if(!rec.raw.ack)q.push('Не было фразы признания до аргументации');
  if(!rec.raw.nextStep)q.push('Следующий шаг не зафиксирован: нет даты и действия');
  if(rec.raw.openQ+rec.raw.closedQ*0.5<2)q.push('Меньше двух открытых вопросов за звонок');
  if(rec.interruptions)q.push(`Перебиваний: ${rec.interruptions}`);
  if(!rec.raw.answerLinked)q.push('Аргументация не связана с болью клиента');
  return q.slice(0,3);
}
let TIMER=null;
function timerStart(){
  clearInterval(TIMER);
  TIMER=setInterval(()=>{
    const s=S.session;if(!s||s.status!=='active')return;
    const paused=s.mode==='easy'&&s.hintOpen;
    if(paused){s.pausedLog++;S.timerPausedLog++;}else{s.t+=1}
    const el=$('#timerEl');if(el)el.textContent=fmt(s.t);
    /* Таймаут неактивности (Приложение А ТЗ): 15 минут без действий — сессия завершается.
       Действием считается любой клик, ввод или нажатие клавиши (см. p6: touchAct). */
    if(idleMinutes()>=idleLimitMin()){
      s.turns.push({who:'sys',txt:'Пауза больше '+idleLimitMin()+' мин — звонок завершён автоматически по таймауту неактивности.',warn:true});
      clearInterval(TIMER);endCall('abort');toast('Таймаут неактивности: звонок завершён','clock');return;
    }
  },1000);
}

let _ringId=0;                        /* счётчик для уникального id градиента: колец на экране бывает несколько */
function ringSVG(score,size=104,w=10){
  const r=(size-w)/2,C=2*Math.PI*r,off=C*(1-score/100);
  /* ОС куратора: ниже проходного (50) — оранжевый, от проходного — зелёный, без красного.
     Цвет — тот же градиент, что у полос прогресса (v2.10): слева темнее, справа светлее.
     В тёмной теме обе точки градиента равны — вид кольца не меняется. */
  const tone=valTone(score)==='ok'?'ok':'warn', gid='ring'+(++_ringId);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--ring-${tone}-a,var(--mint-500))"/>
        <stop offset="1" style="stop-color:var(--ring-${tone}-b,var(--mint-500))"/>
      </linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${w}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s var(--e-out)"/>
    </svg>
    <div class="val"><b>${score}%</b><span>из 100</span></div></div>`;
}
function trajSVG(rec){
  const pts=rec.moodTraj||[{t:0,m:rec.moodEnd}];
  const W=560,H=140,P=26;
  const maxT=Math.max(rec.dur,pts[pts.length-1].t,1);
  const x=t=>P+(W-2*P)*(t/maxT), y=m=>H-P-(H-2*P)*(m/100);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(1)} ${y(p.m).toFixed(1)}`).join(' ');
  const fail=rec.status==='fail'?pts[pts.length-1]:null;
  return `<svg class="traj" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#F5A524"/><stop offset=".55" stop-color="#8FE0B0"/><stop offset="1" stop-color="#12CF9A"/></linearGradient></defs>
    ${[0,30,60,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--stroke-2)" stroke-dasharray="3 5"/>
      <text x="4" y="${y(v)+4}" font-size="9" fill="var(--faint)" font-family="Inter">${v}</text>`).join('')}
    <path d="${d}" fill="none" stroke="url(#tg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.m)}" r="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/>`).join('')}
    ${fail?`<circle cx="${x(fail.t)}" cy="${y(fail.m)}" r="6" fill="var(--amber)"/>
      <text x="${Math.min(x(fail.t),W-90)}" y="${y(fail.m)-14}" font-size="10" font-weight="700" fill="var(--amber)" font-family="Inter">срыв</text>`:''}
    <text x="${W-90}" y="${H-6}" font-size="9" fill="var(--faint)" font-family="Inter">время, реплики →</text>
  </svg>`;
}
function etalonCompare(rec){
  const c=CLIENTS.find(x=>x.id===rec.clientId);
  const mine=rec.turns.filter(t=>t.who==='you').map(t=>t.txt);
  const rows=[];
  etalonOf(c).forEach(e=>{
    if(e.who==='you'&&(e.s||'').trim())rows.push({ref:e.s});
  });
  return `<div class="dlg">
    ${rows.map((r,i)=>`<div class="m you"><b>Ты</b><i>${esc(mine[i]||'— реплики нет: этап пропущен —')}</i></div>
      <div class="m ref cli"><b>Эталон</b><i>${esc(r.ref)}</i></div>`).join('')}
    <div class="m"><b>Почему</b><i>Сравнение поэтапное: клиент раскрывается на признании и открытых вопросах, закрытие фиксируется датой и действием.</i></div>
  </div>`;
}

/* Список сессий с учётом фильтров, сначала новые. Одна функция — и для экрана, и для выгрузки в Excel. */
function journalList(){
  const f=S.filters||(S.filters={type:'',mode:'',grade:'',status:''});
  return S.sessions.filter(s=>{
    const c=CLIENTS.find(x=>x.id===s.clientId)||{};
    return (!f.type||c.type===f.type)&&(!f.mode||s.mode===f.mode)&&(!f.grade||s.grade===f.grade)&&(!f.status||s.status===f.status);
  }).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
}
/* Заголовок группы по дате: «Сегодня», «Вчера» или «19 октября» */
function dayLabel(d){
  const a=new Date(d),n=new Date();
  const day=v=>new Date(v).toDateString();
  if(day(a)===day(n))return 'Сегодня';
  if(day(a)===day(new Date(n.getTime()-864e5)))return 'Вчера';
  return a.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+(a.getFullYear()===n.getFullYear()?'':' '+a.getFullYear());
}

      <div class="note" style="margin-top:10px">Название и описание сохраняются сразу; когда вы закончили править (ушли из поля или выбрали иконку) создаётся версия. Иконка — только из спрайта: эмодзи и «свои» картинки по design.md запрещены. Пустой список — не ошибка, блок просто скрывается. Базовый набор собран из базы знаний компании (разделы 4, 5, 6, 8, 9, 11, 12) — это черновик, его можно править, добавлять и удалять строки.</div>

/* ===== ЗАГРУЗКА (v2.10, пункт 3.7) =========================================
   Пока движок локальный, всё считается мгновенно — но после подключения сервера
   в этих местах будет реальное ожидание. Плашку показываем уже сейчас: текст +
   троеточие, точки загораются по одной по кругу. Плашка не перехватывает клики
   (pointer-events:none) и уходит сама, когда данные готовы. */
const LOADER_TEXTS={
  login:['Заносим данные'],
  /* Разбор и журнал — разделы, которые менеджер видит каждый день: texts чередуются случайно,
     чтобы при частых повторах плашка не читалась как заевшая. */
  review:['Анализируем ваши звонки','Идёт приёмка и отгрузка','Обсуждаем клиента всем отделом'],
  journal:['Собираем данные о клиенте','Считаем KPI и дни до отпуска'],
  stats:['Считаем KPI и дни до отпуска'],
  materials:['Идёт приёмка и отгрузка'],
  prompts:['Обсуждаем клиента всем отделом'],
  wait:['Ожидаем']
};
/* Случайный вариант текста для раздела. Предыдущий вариант не повторяется подряд —
   иначе при частых показах складывается ощущение, что плашка заела. */
const _lastLoader={};
function loaderText(key){
  const v=LOADER_TEXTS[key]||LOADER_TEXTS.wait;
  if(v.length<2)return v[0]||LOADER_TEXTS.wait[0];
  let i=Math.floor(Math.random()*v.length);
  if(v[i]===_lastLoader[key])i=(i+1)%v.length;
  _lastLoader[key]=v[i];
  return v[i];
}
function showLoader(key,ms){
  if(typeof document==='undefined')return;
  document.querySelectorAll('.loader').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='loader';el.setAttribute('role','status');
  el.innerHTML=`<div class="loader-card"><b>${esc(loaderText(key))}</b><span class="dots"><i>.</i><i>.</i><i>.</i></span></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},ms||1100);
}
/* Подсказка о режиме на телефоне и планшете (v2.10, пункт 1.6):
   подпись под переключателем там скрыта, поэтому текст показываем всплывающей плашкой —
   держится 3 секунды и уходит по тапу или свайпу. */

  const tm=setTimeout(kill,3000);
  function kill(){clearTimeout(tm);el.remove()}
  el.addEventListener('click',kill);                       /* тап */
  el.addEventListener('touchmove',kill,{passive:true});     /* свайп */

}
function toast(txt,icn='check'){

  el.className='toast';
  el.innerHTML=`<svg class="ic sm"><use href="#i-${icn}"/></svg>${esc(txt)}`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2600);
}

/* ========================= 16. ЛОГИКА ДИАЛОГА =========================== */
function sendReply(text,fromQuick,quickStage){
  const s=S.session;if(!s||!text.trim())return;
  const interrupted=s.clientTyping;
  const {a,dm}=analyze(text,{engine:s.engine,interrupted,streak:s.streak});
  s.turns.push({who:'you',txt:text.trim(),quick:!!fromQuick,interrupted});
  if(fromQuick)s.quickCount++;                     /* доля шаблонных реплик считается по всем нажатиям */
  s.managerTurns++;s.managerChars+=text.length;s.draft='';
  /* ОС куратора: поле ввода очищается сразу после отправки. И голосовой
     буфер тоже — иначе следующая фраза дописывалась к уже отправленной. */
  micReset();

  /* --- Уместность реплики: закрываем фарм баллами одной и той же фразой -------------
     Баллы (критерии, настрой, продвижение этапа) начисляются, только если реплика:
       1) не повторяет уже звучавшее в этом разговоре — иначе бесконечное нажатие фармит шкалу;
       2) для эталонной фразы — подходит к текущему этапу разговора.
     Сами фразы при этом остаются активными: мы не деактивируем их после использования. */
  /* Механика оценки целиком локальная (analyze ниже): критерии, настрой, этап,
     промахи. ИИ, если он подключён, дописывает только слова клиента — см. 00.2b. */
  const key=norm(text);
  const cur=stageIdx(s);                                   /* текущий этап как индекс 0–4 */
  const fits=quickFits(fromQuick?{s:text,stage:quickStage}:null,cur);
  const repeated=s.usedTexts.indexOf(key)>=0;
  const pays=fits.ok&&!repeated;
  if(!s.usedTexts) s.usedTexts=[];
  s.usedTexts.push(key);
  if(!pays){
    s.useless=(s.useless||0)+1;
    /* Холостая реплика плюсов не даёт, но негатив клиент всё равно слышит:
       повторный спор или перебивание ухудшают настрой и попадают в промахи. */
    if(dm<0){s.mood=clamp(Math.round(s.mood+dm),0,100);s.moodTraj.push({t:s.t,m:s.mood});}
    if(a.mistakes.length)s.mistakes.push(...a.mistakes);
    if(interrupted)s.interruptions+=1;
    const fromStageName=(quickStage!=null)?stageName(quickStage):'другого';
    const why=!fits.ok
      ? 'Фраза не по этапу: сейчас этап «'+stageName(cur)+'», а фраза из «'+fromStageName+'» этапа. Баллы не начислены — эталонный ответ работает только на своём этапе.'
      : (fromQuick?'Эта фраза уже звучала в этом разговоре — повтор баллов не приносит.'
                  :'Такая реплика уже звучала в этом разговоре — повтор баллов не приносит.');
    s.turns.push({who:'sys',txt:why,warn:true});
  }
  if(pays){
  if(s.engine==='llm'){
    s.llmTurns++;
    if(a.tools.length)s.llmTools=new Set([...s.llmTools,...a.tools]);   /* приёмы не повторяются */
    s.llmToolsCount=s.llmTools.size;                                     /* критерий «Инструменты» считает именно это */
  }
  if(a.q)s.openQ+=a.openQ?1:0, s.closedQ+=a.openQ?0:1;
  if(a.q&&s.engine==='fallback')s.qAny++ ;
  if(a.ack)s.ack=true;
  if(a.truth)s.truth=true;
  if(a.nextStep)s.nextStep=true;
  if(a.concrete&&(a.ack||a.yesand||a.others)&&s.engine==='llm')s.answerLinked=true;
  s.mistakes.push(...a.mistakes);
  s.streak=a.q?0:s.streak+1;
  /* настрой */
  s.mood=clamp(Math.round(s.mood+dm),0,100);
  s.moodTraj.push({t:s.t,m:s.mood});
  s.interruptions+=interrupted?1:0;
  }                                                                     /* конец блока начисления */
  /* ответ клиента */
  const c=CLIENTS.find(x=>x.id===s.clientId);
  if(s.engine==='fallback'&&!s.fallbackNotice){
    s.fallbackNotice=true;s.turns.push({who:'sys',txt:'Связь нестабильна: клиент отвечает по сценарию',warn:true});
  }
  const turn=pickTurn(c,text);
  let credit=null;
  if(pays){
    if(s.engine==='fallback')credit=fallbackStageCredit(text,turn,s.mood);
    else credit=turn?turn.s:null;
  }                                       /* холостая реплика разговор не двигает: этап не зачитывается */
  if(credit!==null&&credit>s.stage-1&&credit<=4){
    const newStage=Math.max(s.stage,credit+1);
    if(newStage>s.stage){s.stage=newStage;setTimeout(()=>toast('Этап зачтён: '+stageName(Math.min(newStage-1,4)),'check'),400)}
  }else if(pays&&s.engine==='llm'&&!turn){
    s.turns.push({who:'sys',txt:'Этап не зачтён: ответ не двигает диалог. Проверьте тип клиента и откройте подсказку.'});
  }
  if(a.mistakes.length){
    const m=a.mistakes[0];
    const map={interrupt:'Перебивание — клиент не договорил',argue:'Спор вместо признания: клиент закрывается',
      impose:'Навязанное возражение — клиент ответил «Я этого не говорил»',empty:'Общая фраза без конкретики и вопроса',monolog:'Монолог 3+ реплик без вопроса'};
    s.turns.push({who:'sys',txt:'Промах: '+map[m.k]+'. '+(s.mode==='easy'?'Счётчик виден.':'В режиме Эксперт счётчик скрыт, но учитывается.')});
  }
  const rep=clientReply(turn,c,s.mood,s.engine);
  if(rep.fb)s.fbTurns++;
  /* --- КЛИЕНТ УМЕЕТ ПРОЩАТЬСЯ ----------------------------------------------
     Было: клиент не реагировал на прощание и на зафиксированную договорённость,
     поэтому менеджер уходил на второй и третий круг. Теперь:
       · менеджер зафиксировал следующий шаг на этапе «Закрытие» — клиент
         подтверждает договорённость и прощается;
       · менеджер попрощался прямо — клиент прощается на любом этапе;
       · после прощания у менеджера остаётся одна реплика: клиент вежливо
         возвращает разговор к договорённости и закрывает его.
     Завершает звонок клиент, поэтому менеджер учится фиксировать итог. */
  const bye=RE.farewell.test(norm(text));
  const deal=!!a.nextStep&&stageIdx(s)>=4;
  let closing=0;
  if(s.farewellStep===1)closing=2;              /* менеджер говорит после прощания */
  else if(bye||deal)closing=1;                  /* пора закрывать разговор */
  if(closing)s.farewellStep=closing;

  /* --- ТОЧКА ПОДКЛЮЧЕНИЯ LLM ------------------------------------------------
     Запрос уходит сразу и идёт параллельно: пока клиент «печатает», мы считаем
     баллы. ИИ пишет только реплику клиента (контракт — раздел 00.2b в p3):
     критерии, зачёт этапа и настрой остаются за нашим движком, поэтому оценка
     одинаковая и при живом ИИ, и при сценарии, а таймаут никого не наказывает.
     Триггер «сбой LLM» (S.engine==='fallback') принудительно держит сценарий —
     так на прототипе показывают аварийный режим. */
  let llmReq=null;
  if(svcReady('llm')&&s.engine==='llm'){
    s.llmAsked=(s.llmAsked||0)+1;
    llmReq=LLM_turn(buildLLMPayload(s,text,c,turn));
  }
  save();render();
  /* индикатор «клиент отвечает…» — окно детекции перебивания */
  s.clientTyping=true;
  /* Пока клиент «печатает» (620 мс), ИИ обычно успевает ответить. Не успел,
     вернул пустоту или ерунду — молча берём сценарий: пользователь не ждёт
     и не теряет баллы (механика 7 ТЗ). */
  setTimeout(async ()=>{
    const st=S.session;if(!st)return;
    let txt=rep.txt,src='script';
    if(llmReq){
      const r=await llmReq.catch(()=>null);
      const clean=llmClean(r&&r.text);
      if(clean){
        txt=clean;src='llm';st.llmReplies=(st.llmReplies||0)+1;if(r.model)st.llmModel=r.model;
        /* Точный расход: usage присылает воркер, мы только суммируем.
           Это ответ на вопрос «сколько съел звонок» — по цифрам, не на глаз. */
        const u=r.usage||{};const tot=Number(u.total||u.total_tokens||0)||0;
        st.llmTokens=(st.llmTokens||0)+tot;
        st.llmTokensIn=(st.llmTokensIn||0)+(Number(u.input||u.prompt_tokens)||0);
        st.llmTokensOut=(st.llmTokensOut||0)+(Number(u.output||u.completion_tokens)||0);
        if(r.cached)st.llmCached=(st.llmCached||0)+1;
      }
      else{st.llmFallbacks=(st.llmFallbacks||0)+1}
    }
    /* Закрывающие реплики пишет сценарий: финал должен быть вежливым
       и предсказуемым, модель тут не нужна. */
    if(closing===1){txt=goodbye(c);src='script'}
    if(closing===2){txt=closingPush(c);src='script'}
    st.turns.push({who:'cli',txt,src});st.clientChars+=txt.length;
    if(closing){
      const sid=S.session.id;
      setTimeout(()=>{
        if(!S.session||S.session.id!==sid)return;
        toast('Клиент попрощался — звонок завершён','phone');
        endCall('done');
      },closing===2?2600:3600);
    }
    speak(txt,st);
    render();
    setTimeout(()=>{if(S.session){S.session.clientTyping=false;render()}},Math.min(2600,700+txt.length*22));
  },620);
  if(s.mood<=0&&!s.farewellStep){
    s.failReason=buildFailReason();
    setTimeout(()=>{const st=S.session;if(!st)return;
      st.turns.push({who:'cli',txt:farewell(c)});
      st.status='fail';render();endCall('fail')},1600);
  }
}
function farewell(c){
  const m={'Скептик':'Всё, разговор закончен. Больше не звоните.','Спешащий':'Всё, мне некогда. Пока.',
    'Эмоционал':'Ой, знаете… мне неприятно. Давайте закончим.','Молчаливый':'(пауза) Ясно. До свидания.',
    'Критик компании':'Я так и знал. До свидания.','Экономист':'Разговор не имеет экономического смысла. Всего доброго.',
    'Технарь':'Это пустой разговор. Отключаюсь.'};
  return m[c.type]||'До свидания.';
}
/* Тёплое прощание: клиент закрывает разговор сам. Раньше прощание было только
   у проваленного звонка («Больше не звоните») — из-за этого менеджеры ходили
   по кругу на последнем этапе. Теперь у каждого типа своя, по характеру. */
function goodbye(c){
  const m={'Скептик':'Договорились. Жду цифры и проект договора — посмотрю внимательно. На этом всё, до связи.',
    'Спешащий':'Хорошо, тогда жду. Всё, мне бежать — до связи.',
    'Эмоционал':'Спасибо, мне стало спокойнее. Жду ваш расчёт. Хорошего дня!',
    'Молчаливый':'Хорошо. Буду ждать. До свидания.',
    'Критик компании':'Ладно, убедили. Присылайте — посмотрю. До свидания.',
    'Экономист':'Принимается. Жду расчёт по объёмам, сравню с текущими. Всего доброго.',
    'Технарь':'Принято. Шлите спецификацию — сверю с нашими допусками. До связи.'};
  return m[c.type]||'Договорились. Жду от вас материалы. До свидания.';
}
/* Менеджер продолжает после прощания: одна вежливая реплика-возврат, и всё. */
function closingPush(c){
  const m={'Скептик':'Мы уже всё обсудили — жду материалы. Всего доброго.',
    'Спешащий':'У меня всё, побежал. Жду расчёт, до связи!',
    'Эмоционал':'Мы же договорились — я жду ваш расчёт. Хорошего дня!',
    'Молчаливый':'(пауза) Мы договорились. До свидания.',
    'Критик компании':'Мы закончили. Присылайте, посмотрю. До свидания.',
    'Экономист':'Решение принято, дальше — расчёт. Всего доброго.',
    'Технарь':'Итог ясен: жду спецификацию. До связи.'};
  return m[c.type]||'Мы договорились — жду материалы. Всего доброго.';
}
function buildFailReason(){
  const s=S.session;
  const counts={};
  s.mistakes.forEach(m=>counts[m.k]=(counts[m.k]||0)+1);
  const parts=[];
  if(counts.argue)parts.push(`спорил ${counts.argue} ${counts.argue===1?'раз':counts.argue<5?'раза':'раз'}`);
  if(counts.interrupt)parts.push(`перебивал ${counts.interrupt} ${counts.interrupt===1?'раз':'раза'}`);
  if(counts.impose)parts.push('навязал возражение за клиента');
  if(counts.empty)parts.push('говорил общими фразами без конкретики');
  if(counts.monolog)parts.push('долго говорил монологом без вопросов');
  const base=parts.length?parts.join(', '):'давил без признания';
  return 'Причина: '+base.charAt(0).toUpperCase()+base.slice(1)+'.';
}

/* --------------------------- 17. ГОЛОС И ГУДКИ -------------------------- */
let SPEAKING=false;
/* ТОЧКА ПОДКЛЮЧЕНИЯ TTS (ENV.tts): после подключения сервер отдаёт аудио Silero —
   fetch(ENV.apiBase+'/tts',{text,voice}) → <audio>. Пока endpoint пуст, работает
   демо-озвучка браузером; логика звонка при этом не меняется. */
function speak(txt,st){
  if(!S.ttsOn)return;
  if(svcReady('tts')){playRemote(txt);return}      /* сервер подключён → синтез на сервере */
  speakDemo(txt);                                  /* демо и фолбэк: синтез браузером */
}
/* Серверный синтез: вызывается, только когда заполнен ENV.tts.endpoint */
function playRemote(txt){
  try{
    fetch(ENV.apiBase+ENV.tts.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:txt,voice:ENV.tts.voice||'baya'})})
      .then(r=>r.ok?r.blob():null).then(b=>{
        if(!b){speakLocal(txt);return}                 /* сервис ответил ошибкой → тихий фолбэк */
        const a=new Audio(URL.createObjectURL(b));a.play().catch(()=>{});
      }).catch(()=>speakLocal(txt));
  }catch(e){speakLocal(txt)}
}
/* Демо-озвучка браузером — она же фолбэк, если сервер недоступен */
function speakLocal(txt){speakDemo(txt)}
function speakDemo(txt){
  try{
    if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(txt.replace(/\(пауза\)/g,'…'));
    u.lang='ru-RU';u.rate=1.02;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ru'));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
/* Гудки срыва (WebAudio) */
function beeps(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    const ctx=new Ctx();
    [0,0.42,0.84].forEach((t,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=425;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+(i===2?0.5:0.26));
      o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.6);
    });
  }catch(e){}
}
/* ================== 17.1. ГОЛОСОВОЙ ВВОД (STT) ==========================
   ТОЧКА ПОДКЛЮЧЕНИЯ STT (ENV.stt): после подключения сервера микрофон стримится
   по WebSocket (16 кГц, моно) на Vosk, частичные результаты идут в поле ввода.

   До подключения работает распознавание браузера (Chrome/Edge, Web Speech API).
   Правила, которые важны для иммерсии:
     1) разрешение на микрофон спрашиваем ОДИН раз за сессию — при старте звонка
        (вместе с записью, recStart). Повторно браузер спросит только если его
        открыли как локальный файл (file://) — Chrome не запоминает разрешение
        для файлов; лечится открытием через локальный сервер или по ссылке;
     2) диктовка НЕПРЕРЫВНАЯ: пауза не завершает ввод, текст ДОПИСЫВАЕТСЯ к уже
        набранному; остановка — повторным нажатием микрофона;
     3) если распознавание недоступно, ничего не подставляем: раньше демо-заглушка
        вставляла эталонную фразу, из-за чего казалось, что система отвечает сама.

   Проверка на разных пользователях: экран 09 «Статус готовности» → «Проверка
   микрофона и голоса» — показывает по каждому пункту, что поддерживает браузер. */
let REC=null,micRecording=false,micBase='',micFinals='',micInterim='';   /* голосовой ввод: буфер диктовки */
function sttSupport(){
  if(svcReady('stt'))return {ok:true,kind:'server'};
  if(typeof window==='undefined')return {ok:false,why:'нет окна браузера'};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return {ok:false,why:'этот браузер не умеет распознавать речь — нужен Chrome или Edge'};
  let warn='';
  try{
    if(location.protocol==='file:')
      warn='Прототип открыт как файл (file://): Chrome не запоминает разрешение на микрофон. Откройте через локальный сервер или по ссылке — тогда разрешение спросят один раз.';
  }catch(e){}
  return {ok:true,kind:'web',warn};
}
function micToggle(){
  if(micRecording){stopDictation();return}
  const sup=sttSupport();
  if(!sup.ok){
    /* Честно объясняем, почему не работает. Эталонные фразы НЕ подставляем. */
    S.session&&(S.session.micHint=sup.why);
    render();toast('Голосовой ввод недоступен: '+sup.why+'. Введите текст — тренировка идёт как обычно','warn');
    return;
  }
  if(sup.warn){toast(sup.warn,'warn')}
  startDictation();
}
function startDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  micBase=(S.draft||'').trim();          /* уже набранный текст не теряем */
  micFinals='';micInterim='';
  try{REC=new SR()}catch(e){REC=null}
  if(!REC){toast('Не удалось запустить распознавание — введите текст','warn');return}
  REC.lang='ru-RU';
  REC.continuous=true;                   /* пауза больше не завершает диктовку */
  REC.interimResults=true;
  REC.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal)micFinals=(micFinals?micFinals+' ':'')+String(r[0].transcript).trim();
      else interim+=String(r[0].transcript);
    }
    micInterim=interim;
    /* Дописываем к тому, что уже было: текст продолжается с того же места */
    S.draft=[micBase,micFinals,micInterim].filter(x=>x&&x.trim()).join(' ').replace(/\s+/g,' ').trim();
    render();
  };
  REC.onerror=e=>{
    const err=(e&&e.error)||'';
    if(err==='not-allowed'||err==='service-not-allowed'){
      micRecording=false;
      if(S.session)S.session.micHint='Браузер не дал доступ к микрофону. Разрешите его в адресной строке — или откройте прототип по ссылке (https), тогда доступ спрашивают один раз.';
      render();
    }
    /* остальные ошибки (пауза, сеть) обрабатывает onend: слушаем дальше */
  };
  REC.onend=()=>{
    /* Пауза/перезапуск: незавершённый промежуточный текст не теряем — фиксируем его */
    micFlushInterim();
    if(micRecording){
      try{REC.start();return}catch(e){}   /* пауза или обрыв — продолжаем слушать с того же места */
    }
    micRecording=false;render();
  };
  try{
    REC.start();micRecording=true;
    if(S.session)S.session.micHint='';
    render();
    toast('Слушаю… говорите в своём темпе: пауза не завершает ввод, повторное нажатие — стоп','volume');
  }catch(e){micRecording=false;toast('Не удалось запустить распознавание: '+e.message,'warn')}
}
/* Промежуточный результат → в финальный: иначе на паузе терялось последнее слово */
function micFlushInterim(){
  if(micInterim&&micInterim.trim())micFinals=(micFinals?micFinals+' ':'')+micInterim.trim();
  micInterim='';
}
/* Реплику отправили — слушаем с чистого листа. Распознавание при этом
   продолжает работать (не надо заново нажимать микрофон), но накопленное
   забываем: следующая фраза не должна приклеиваться к предыдущей. */
function micReset(){
  micBase='';micFinals='';micInterim='';
  S.draft='';
  const el=$('#say');if(el)el.value='';
}
function stopDictation(){
  micRecording=false;
  micFlushInterim();
  try{REC&&REC.stop()}catch(e){}
  /* Фиксируем распознанное в поле — ничего не теряем */
  S.draft=[micBase,micFinals].filter(x=>x&&x.trim()).join(' ').replace(/\s+/g,' ').trim()||S.draft||'';
  render();toast('Голосовой ввод остановлен','check');
}
/* Диагностика для проверки на нескольких пользователях: экран 09, карточка «Проверка микрофона» */
function micDiagnostics(){
  const rows=[];
  const add=(n,ok,d)=>rows.push({n,ok:ok===true?'ok':ok===false?'bad':'warn',d:d||''});
  let secure=true,proto='—';
  try{proto=location.protocol;secure=(typeof isSecureContext!=='undefined')?!!isSecureContext:location.protocol!=='file:'}catch(e){}
  add('Страница открыта', proto==='file:'?'warn':true, proto==='file:'?'как файл (file://) — Chrome не запомнит разрешение на микрофон':'страница отдана сервером/по ссылке ('+proto+')');
  add('Безопасный контекст', secure, secure?'браузер разрешит доступ к микрофону':'нужен https или localhost');
  const hasGUM=typeof navigator!=='undefined'&&!!navigator.mediaDevices&&!!navigator.mediaDevices.getUserMedia;
  add('Доступ к микрофону (getUserMedia)', hasGUM, hasGUM?'есть — используется для записи звонка':'нет в этом браузере');
  const SR=(typeof window!=='undefined')&&(window.SpeechRecognition||window.webkitSpeechRecognition);
  add('Распознавание речи (STT)', SR?true:false, SR?'распознавание браузером доступно':'нужен Chrome или Edge (в Perplexity и встроенных браузерах нет)');
  const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window;
  add('Озвучка клиента (TTS)', hasTTS, hasTTS?'синтез браузером доступен':'озвучка будет только у клиента-сервера');
  const hasRec=typeof window!=='undefined'&&!!window.MediaRecorder;
  add('Запись звонка (MediaRecorder)', hasRec, hasRec?'запись в браузере работает':'запись появится с сервером');
  const permState=(S.session&&S.session.recState)||'off';
  add('Разрешение на микрофон в этой сессии',
      permState==='on'?true:permState==='unavailable'?'bad':'warn',
      permState==='on'?'дано — повторно спрашивать не должен':permState==='unavailable'?'не выдано: браузер спросит при следующем звонке':'звонок ещё не начат — разрешение спросим один раз при старте');
  return rows;
}

function downloadBlob(name,blob){
  try{

    if(blob instanceof Blob&&typeof URL!=='undefined'&&URL.createObjectURL){
      a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();
      setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove()}catch(e){}},800);
      return true;
    }
  }catch(e){}
  return false;
}

/* ========================= 19. ВЕРСИИ И ИМПОРТ =========================== */
function bumpVersion(note,by){
  const cur=activeVersion().replace('v','').split('.').map(Number);
  cur[2]=(cur[2]||0)+1;
  const v='v'+cur.join('.');
  S.versions.forEach(x=>x.active=false);
  S.versions.unshift({v,by:by||'М. Суржко',d:'только что',note,active:true});
  save();return v;
}
function rollback(idx){
  const target=S.versions[idx];
  S.versions.forEach(x=>x.active=false);
  const v=bumpVersion(`Откат к ${target.v}: «${target.note}»`);
  toast('Активна '+v+' — создана отдельная запись об откате','clock');
}
function applyImport(data){
  try{
    if(Array.isArray(data.criteria)){
      data.criteria.forEach(ic2=>{const c=S.criteria.find(x=>x.key===ic2.key);if(c){if(ic2.weight!=null)c.w=ic2.weight;if(ic2.enabled!=null)c.enabled=ic2.enabled}});
    }
    if(Array.isArray(data.stages)){
      data.stages.forEach((st,i)=>{if(S.stages[i]){if(st.n)S.stages[i].n=st.n;if(st.goal)S.stages[i].goal=st.goal;
        if(Array.isArray(st.phrases))S.stages[i].phrases=st.phrases;if(Array.isArray(st.checklist))S.stages[i].checklist=st.checklist;if(st.dont)S.stages[i].dont=st.dont}});
    }
    if(Array.isArray(data.prompts)){
      S.prompts=S.prompts||{};
      data.prompts.forEach(p=>{if(p.id)S.prompts[p.id]={situation:p.situation,rules:p.rules,first:p.first}});
    }
    if(Array.isArray(data.objections)&&data.objections.length){
      /* Возражения и приёмы для сложных случаев — контент: заменяются целиком из JSON */
      OBJECTIONS.splice(0,OBJECTIONS.length,...data.objections.filter(o=>o&&o.n));
    }
    if(Array.isArray(data.extra)&&data.extra.length){
      OBJECTION_EXTRA.splice(0,OBJECTION_EXTRA.length,...data.extra.filter(o=>o&&o.n));
    }
    if(Array.isArray(data.tools)){
      S.tools=S.tools||{};
      data.tools.forEach(t=>{if(t&&t.id&&Array.isArray(t.tools))S.tools[t.id]=t.tools});
    }
    if(data.quickPhrases){
      // поддержка старого формата (массив строк) и нового (массив {s,stage})
      S.quickPhrases={};
      Object.keys(data.quickPhrases).forEach(k=>{
        S.quickPhrases[k]=(data.quickPhrases[k]||[]).map(p=>typeof p==='string'?{s:p,stage:null}:{s:p.s,stage:(p.stage!=null?p.stage:null)});
      });
    }
    const v=bumpVersion('Импорт JSON: контент заменён, откат доступен');
    const n=recalcAll();
    toast('Импорт применён: '+v+(n?`, пересчитано сессий: ${n}`:''),'upload');
  }catch(e){toast('Не удалось прочитать JSON','x')}
  render();
}

/* ============================ 20. СОБЫТИЯ =============================== */
document.addEventListener('click',e=>{

      /* На телефоне и планшете подпись под переключателем скрыта — показываем её плашкой на 3 секунды. */
      const narrow=(S.device&&S.device!=='desktop')||(typeof matchMedia!=='undefined'&&matchMedia('(max-width:1120px)').matches);

    if(t.dataset.sw){t.classList.toggle('on');return}
    if(t.dataset.crit!=null){

      toast(c.enabled?`Критерий «${c.n}» включён`:`«${c.n}» выключен — выпадает из знаменателя`,'gear');

      render();return}
    if(t.dataset.mat!=null){S.materials[+t.dataset.mat].inLLM=!S.materials[+t.dataset.mat].inLLM;save();render();return}
    if(t.dataset.at){S.adminTab=t.dataset.at;

    if(t.dataset.pc){S.promptClient=t.dataset.pc;render();return}

    if(t.dataset.say){

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){window._qf=true;const v=el.value;S._q=v;const html=$('#app .view');
    const caret=el.selectionStart;renderContactsInto(v);
    const q=$('#q');if(q){q.focus();q.setSelectionRange(caret,caret)}return}
  if(el.id==='say'){S.draft=el.value;return}
  if(el.dataset.weight!=null){S.criteria[+el.dataset.weight].w=Math.max(0,+el.value||0);S.weightsDirty=true;save();return}
  if(el.dataset.hintlimit!=null){S.hintLimit=Math.max(1,+el.value||3);save();toast('Лимит подсказок в «Эксперте»: '+S.hintLimit,'gear');return}
  if(el.dataset.keepdays!=null){S.audioKeepDays=Math.max(1,+el.value||30);save();return}
  if(el.dataset.pass!=null){
    S.pass=Math.max(0,Math.min(100,+el.value||50));save();
    toast('Проходной барьер цвета: '+S.pass+' % — грейды не меняются, это только цвет графиков','gear');
    render();return}
  if(el.dataset.prompt!=null){
    S.prompts=S.prompts||{};const cid=S.promptClient;
    S.prompts[cid]={...(S.prompts[cid]||{}),[el.dataset.prompt]:el.value};save();return}
  /* Текст реплики эталона: сохраняется по мере ввода, версия — при выходе из поля */
  if(el.dataset.ed!=null){
    const c=CLIENTS.find(x=>x.id===S.etalonClient);const arr=etalonSave(c);const i=+el.dataset.ed;
    if(arr[i])arr[i].s=el.value;save();return}
  /* Техники под тип клиента: текст сохраняется по мере ввода, версия создаётся при выходе из поля */
  if(el.dataset.tn!=null||el.dataset.td!=null){
    const c=CLIENTS.find(x=>x.id===S.toolClient);const arr=toolsEdit(c);
    const i=+(el.dataset.tn!=null?el.dataset.tn:el.dataset.td);
    if(arr[i]){if(el.dataset.tn!=null)arr[i].n=el.value;else arr[i].d=el.value;save()};
    return}
});
/* поиск без перерисовки всего экрана */
function renderContactsInto(v){
  const st=myStats();
  const list=CLIENTS.filter(c=>!v||norm(c.name+c.company+c.type).includes(norm(v)));
  const host=$('#app .view');
  if(!host)return;
  const grid=host.querySelector('.grid');
  if(!grid)return;
  grid.innerHTML=list.map(c=>`<button class="contact" data-open="${c.id}">
      <span class="ava" style="background:${c.grad}">${c.ini}</span>
      <span class="who2"><b>${c.name}</b><span>${c.company} · ${c.role}</span>
        <span class="row" style="gap:6px;margin-top:6px"><span class="chip ${c.typeC}">${c.type}</span>
        ${st.best[c.id]?`<span class="chip slate">лучший ${st.best[c.id]}%</span>`:`<span class="chip slate">не отработан</span>`}</span></span>
      <span class="go">${ic('phone')}</span></button>`).join('')||'<p class="mute">Ничего не найдено</p>';
}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.filter){S.filters={...(S.filters||{}),[el.dataset.filter]:el.value};S.journalShown=JOURNAL_PAGE;render();return}
  if(el.dataset.period){S.statsPeriod=+el.value;render();return}
  if(el.dataset.roleacc){
    /* Смена роли учётной записи: применяется к новым входам, создаёт версию */
    const acc=(S.accounts||[]).find(x=>x.email===el.dataset.roleacc);
    if(acc){acc.role=el.value;const v=bumpVersion(`Роль изменена: ${acc.n} → ${ROLES[el.value].n}`);
      toast(`${acc.n}: ${ROLES[el.value].n} · ${v}`,'lock');render()}
    return}
  if(el.id==='matFile'&&el.files&&el.files[0]){
    /* Разбор файла материалов в браузере: txt/md — сразу, docx — распаковкой zip.
       Можно выбрать несколько файлов сразу (база знаний, разбитая по разделам). */
    const files=Array.from(el.files);
    files.forEach((f,i)=>{
      const m={n:f.name,t:(f.name.split('.').pop()||'').toUpperCase()+' · '+(Math.max(1,Math.round(f.size/1024)))+' КБ',s:'обработка',inLLM:false};
      S.materials.unshift(m);
      parseMaterialFile(f).then(r=>{
        m.s=r.ok?'готов':'не распознан';m.text=r.ok?r.text:'';m.inLLM=r.ok;
        m.t=(r.kind||'')+' · '+(r.ok?Math.round((r.text||'').length/1000)+' тыс. знаков':(r.why||'не читается'));
        save();render();
        if(files.length<4)toast(r.ok?`Файл разобран в браузере: ${m.n}`:'Не удалось разобрать: '+m.n+(r.why?' ('+r.why+')':''),r.ok?'check':'x');
      });
    });
    render();
    toast(files.length>1?`В обработку взято файлов: ${files.length}`:'Файл взят в обработку','upload');
    return}
  if(el.dataset.ewho!=null){
    const c=CLIENTS.find(x=>x.id===S.etalonClient);const arr=etalonSave(c);const i=+el.dataset.ewho;
    if(arr[i]){arr[i].who=(el.value==='cli'?'cli':'you');if(arr[i].who!=='you')arr[i].stage=null;save();
      if(S.quickPhrases)S.quickPhrases[c.id]=buildQuickPhrases(c).slice(0,6);
      const v=bumpVersion(`Эталон «${c.type}»: сменён автор реплики`);
      toast('Автор реплики обновлён · '+v,'check');render()}
    return}
  if(el.dataset.ed!=null){
    /* render() здесь не вызываем: он пересобирает DOM до того, как браузер доставит
       клик по кнопке под полем («Удалить», «Вернуть базовый эталон») — нажатие терялось. */
    const c=CLIENTS.find(x=>x.id===S.etalonClient);
    if(S.quickPhrases)S.quickPhrases[c.id]=buildQuickPhrases(c).slice(0,6);
    const v=bumpVersion(`Эталон «${c.type}»: текст реплики изменён`);
    toast('Сохранено. Активная версия: '+v,'check');return}
  if(el.dataset.tico!=null){
    const c=CLIENTS.find(x=>x.id===S.toolClient);const arr=toolsEdit(c);const i=+el.dataset.tico;
    if(arr[i]){arr[i].ico=el.value;save();
      const v=bumpVersion(`Техники «${c.type}»: иконка изменена`);
      toast('Иконка обновлена · '+v,'check');render()}
    return}
  if((el.dataset.tn!=null||el.dataset.td!=null)&&el.closest('.card')){
    /* см. выше: без render(), иначе клик по «Удалить»/«Сбросить» пропадает */
    const c=CLIENTS.find(x=>x.id===S.toolClient);
    const v=bumpVersion(`Техники «${c.type}» обновлены методистом`);
    toast('Сохранено. Активная версия: '+v,'check');return}
  if(el.dataset.estage!=null){
    /* Правка этапа у реплики эталона: этап хранится в самой реплике (S.etalons),
       быстрые фразы пересобираются, создаётся версия */
    const [cid,idx]=el.dataset.estage.split(':');const i=+idx;
    const c0=CLIENTS.find(x=>x.id===cid);const arr0=etalonSave(c0);
    if(arr0[i])arr0[i].stage=(el.value===''?null:+el.value);
    const c=CLIENTS.find(x=>x.id===cid);
    if(S.quickPhrases&&S.quickPhrases[cid])S.quickPhrases[cid]=buildQuickPhrases(c).slice(0,6);
    const v=bumpVersion(`Этап реплики эталона изменён: ${c.type}`);
    toast('Этап реплики обновлён. Активная версия: '+v,'gear');render();return}
  if(el.id==='importFile'&&el.files&&el.files[0]){
    const f=el.files[0];const r=new FileReader();
    r.onload=()=>{try{applyImport(JSON.parse(r.result))}catch(err){toast('Файл не является корректным JSON','x')}};
    r.readAsText(f);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='say'){e.preventDefault();sendReply(e.target.value,false);return}
  if(e.key==='Enter'&&e.target.id==='adminPass'){$('[data-act="adminlogin"]').click();return}
  if(e.key==='Enter'&&e.target.id==='fCode'){$('[data-act="login"]').click();return}
  if(e.key==='Escape'){
    if(S.session&&S.session.hintOpen){S.session.hintOpen=false;render();return}
    const rl=$('#rail');if(rl&&rl.classList.contains('open')){rl.classList.remove('open');return}
  }
});
const fabEl=$('#fab');if(fabEl)fabEl.addEventListener('click',()=>{const rl=$('#rail');if(rl)rl.classList.toggle('open')});
/* Рельса без прокрутки: если содержимое не влезает в высоту окна, демо-блоки сворачиваются сами.
   Перед деплоем демо-панель удаляется — тогда в рельсе остаются бренд, экраны, тема и вид прототипа,
   и она целиком помещается в любом десктопном окне. */
function fitRail(){
  const r=$('#rail'); if(!r) return;
  const folds=[$('#devTrig'),$('#devLegend')].filter(Boolean);
  folds.forEach(f=>{f.open=true});                          /* сначала пробуем раскрыть всё */
  for(let i=folds.length-1;i>=0;i--){                       /* если не влезает — сворачиваем по одному, снизу вверх */
    if(r.scrollHeight<=r.clientHeight+1) break;
    folds[i].open=false;
  }
}
window.addEventListener('resize',fitRail);
window.addEventListener('load',fitRail);
/* Любое действие сбрасывает счётчик таймаута неактивности (15 минут, Приложение А ТЗ) */
['click','keydown','input','touchstart','mousemove'].forEach(ev=>
  document.addEventListener(ev,()=>touchAct(),{passive:true}));
/* Слежение за сетью: в офлайне прототип продолжает работать, показываем бейдж */
window.addEventListener('online',()=>{if(S.session&&S.session.status==='active')render()});
window.addEventListener('offline',()=>{if(S.session&&S.session.status==='active'){render();toast('Сеть пропала: работаем локально, сессия не прерывается','warn')}});
/* приветственный тост */
window.addEventListener('load',()=>{
  document.documentElement.dataset.theme=S.theme;
  render();
  setTimeout(()=>toast('Прототип «Дозвон» по ТЗ v2.9: работает без сервера и ключей · выберите режим и клиента','spark'),600);
});
render();

<!-- ===== SCORM: минимальный репортёр для LMS ==============================
     Если пакет открыт внутри LMS, ищем её SCORM-API и аккуратно сообщаем
     статус. Вне LMS (обычный браузер, GitHub Pages) скрипт просто молчит —
     прототип работает как обычно. Никаких внешних вызовов. -->
<script>
(function(){
  function findAPI(w){
    var tries=0;
    while(w && tries<7){
      if(w.API)return {api:w.API,v12:true};
      if(w.API_1484_11)return {api:w.API_1484_11,v12:false};
      try{ if(w.parent&&w.parent!==w){w=w.parent;tries++;continue} }catch(e){}
      try{ if(w.opener&&w.opener.API)return {api:w.opener.API,v12:true};
           if(w.opener&&w.opener.API_1484_11)return {api:w.opener.API_1484_11,v12:false}; }catch(e){}
      break;
    }
    return null;
  }
  var f=findAPI(window); if(!f)return;                 // открыли не из LMS — молчим
  try{ f.v12?f.api.LMSInitialize(''):f.api.Initialize(''); }catch(e){return}
  function set(v){
    try{
      if(f.v12){f.api.LMSSetValue('cmi.core.lesson_status',v);f.api.LMSCommit('')}
      else{f.api.SetValue('cmi.completion_status',v==='completed'?'completed':'incomplete');f.api.Commit('')}
    }catch(e){}
  }
  set('incomplete');
  window.addEventListener('beforeunload',function(){
    /* «Пройдено» ставим, если менеджер довёл хотя бы один звонок до разбора */
    var done=false;
    try{ done=(window.S&&S.sessions&&S.sessions.length>0)||false }catch(e){}
    set(done?'completed':'incomplete');
    try{ f.v12?f.api.LMSFinish(''):f.api.Terminate('') }catch(e){}
  });
})();
</script>
