<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дозвон — тренажёр B2B-звонков · прототип по ТЗ v2.9</title>
<meta name="theme-color" content="#0B0D13">
<style>
/* ============================================================================
   ДОЗВОН · дизайн-система «Holo Mint»
   Токены согласованы с порталом «Отдел развития и обучения».
   Логотип: знак — мята #07EBAE / violet #716DF0, вордмарк — Manrope 800.
   ========================================================================= */
:root{
  --mint-400:#3BF6B9; --mint-500:#12CF9A; --mint-600:#0BAE81; --brand-mint:#07EBAE;
  --violet-400:#776CEB; --violet-500:#6C63E8; --brand-violet:#716DF0;
  --sky-400:#6FC5E8; --sky-500:#2AA7F0;
  --holo-1:#8FD7FF; --holo-2:#C9A8FF; --holo-3:#9BFFE0; --holo-4:#FFB6E6;
  --amber:#F5A524; --rose:#F2506E; --pink:#C86BE8; --slate:#64748B;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-2xl:34px; --r-pill:999px;
  --f-head:"Manrope","Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:"Inter","Manrope",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --e-out:cubic-bezier(.22,1,.36,1); --t-fast:.16s; --t:.26s; --t-slow:.42s;
}
html[data-theme="light"]{
  --bg:#EDF0F8; --bg1:radial-gradient(60% 60% at 12% 8%,#DFF8EF 0,transparent 60%);
  --bg2:radial-gradient(55% 55% at 92% 90%,#E7E1FD 0,transparent 62%);
  --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#EFF2F9;
  --glass:rgba(255,255,255,.74); --glass-brd:rgba(255,255,255,.92);
  --ink:#141726; --ink-2:#3B4157; --muted:#5C6480; --faint:#8D94AB;
  --stroke:#E5E8F2; --stroke-2:#EDF0F7;
  --shadow-sm:0 2px 6px rgba(21,25,48,.06);
  --shadow:0 14px 30px -14px rgba(21,25,48,.18),0 2px 6px rgba(21,25,48,.05);
  --shadow-lg:0 34px 70px -28px rgba(21,25,48,.32),0 8px 20px -12px rgba(21,25,48,.16);
  --mint-soft:#DCF9EF; --violet-soft:#EEEBFD; --sky-soft:#E3F2FA; --amber-soft:#FEF3DF;
  --rose-soft:#FDE7EC; --pink-soft:#F6E8FD; --slate-soft:#EDF0F6;
  --mint-ink:#07745A; --violet-ink:#4A41C4; --accent:var(--violet-500); --on-accent:#fff;
  --glow-mint:0 0 0 rgba(0,0,0,0); --rec:#F2506E; --holo-op:.55; --wordmark:#10141A;
  --call-bg:linear-gradient(180deg,#F7F9FD,#EEF2FA);
}
html[data-theme="dark"]{
  --bg:#0B0D13; --bg1:radial-gradient(60% 60% at 12% 8%,rgba(59,246,185,.10) 0,transparent 62%);
  --bg2:radial-gradient(55% 55% at 92% 88%,rgba(119,108,235,.20) 0,transparent 64%);
  --surface:#15181F; --surface-2:#1B1F29; --surface-3:#232734;
  --glass:rgba(27,31,41,.74); --glass-brd:rgba(255,255,255,.08);
  --ink:#F1F4FA; --ink-2:#CBD1E0; --muted:#98A0B8; --faint:#6C7488;
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.055);
  --shadow-sm:0 2px 6px rgba(0,0,0,.4);
  --shadow:0 18px 38px -18px rgba(0,0,0,.72),0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 40px 90px -30px rgba(0,0,0,.85),0 10px 26px -14px rgba(0,0,0,.6);
  --mint-soft:rgba(59,246,185,.14); --violet-soft:rgba(119,108,235,.20); --sky-soft:rgba(42,167,240,.16);
  --amber-soft:rgba(245,165,36,.16); --rose-soft:rgba(242,80,110,.16); --pink-soft:rgba(200,107,232,.16);
  --slate-soft:rgba(255,255,255,.07);
  --mint-ink:#3BF6B9; --violet-ink:#A79DFF; --accent:var(--mint-400); --on-accent:#07271C;
  --glow-mint:0 6px 22px -6px rgba(59,246,185,.5); --rec:#FF5470; --holo-op:.85; --wordmark:#F1F4FA;
  /* Тёмная тема: декоративные пятна — насыщенные jewel-цвета (v2.7).
     Светлая пастель на тёмном фоне гасится и читается серой заплатой;
     изумруд #0BAE81 · сапфир #3B6FE0 · малахит #12CF9A · аметист #8E5BE8. */
  --holo-1:#0BAE81; --holo-2:#3B6FE0; --holo-3:#12CF9A; --holo-4:#8E5BE8;
  --call-bg:linear-gradient(180deg,#111419,#0B0D13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:15px/1.45 var(--f-body);color:var(--ink);background:var(--bg);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background:var(--bg1)} body::after{background:var(--bg2)}
h1,h2,h3,h4,.hd{font-family:var(--f-head);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.08}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--faint) 38%,transparent);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;flex:none;display:block}.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}.ic.xl{width:26px;height:26px}
/* метка режима и иконки плиток вместо эмодзи (v2.6) */
.ic-dot{width:9px;height:9px}
.ic-easy{color:var(--mint-500)} .ic-expert{color:var(--violet-500)}
html[data-theme="dark"] .ic-easy{color:var(--mint-400)} html[data-theme="dark"] .ic-expert{color:var(--violet-400)}
.tool>.ic{color:var(--mint-ink);margin-top:2px} html[data-theme="dark"] .tool>.ic{color:var(--mint-400)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* =============================== КАРКАС ================================== */
.stage{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:18px;min-height:100vh}
.rail{position:sticky;top:18px;max-height:calc(100dvh - 36px);overflow:auto;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--glass-brd);border-radius:var(--r-xl);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:auto;flex:none}
.wordmark{font-family:var(--f-head);font-weight:800;font-size:19px;letter-spacing:-.045em;color:var(--wordmark);line-height:1}
.wordmark em{font-style:normal;color:var(--brand-violet)}
.brand small{display:block;font:500 10.5px/1.3 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:3px}
.rail-t{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.nav{display:flex;flex-direction:column;gap:1px}
/* Сворачиваемые демо-блоки рельсы: JS закрывает их, если содержимое не влезает в высоту окна */
.rail-dev>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;transition:color var(--t-fast)}
.rail-dev>summary::-webkit-details-marker{display:none}
.rail-dev>summary::after{content:'▾';font-size:9px;letter-spacing:0}
.rail-dev:not([open])>summary{margin-bottom:0}
.rail-dev:not([open])>summary::after{content:'▸'}
.rail-dev>summary:hover{color:var(--ink)}
.rail-dev>summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.nav-i{display:flex;gap:8px;align-items:center;padding:5px 9px;min-height:38px;border-radius:var(--r-sm);color:var(--muted);font-size:13px;text-align:left;transition:all var(--t-fast)}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--mint-soft);color:var(--mint-ink);font-weight:600}
html[data-theme="dark"] .nav-i.on{color:var(--mint-400)}
.nav-i .n{width:18px;font:700 9.5px/16px var(--f-mono);color:var(--faint);text-align:center;background:var(--surface-2);border-radius:6px;flex:none}
.nav-i.on .n{background:var(--surface);color:var(--mint-ink)}
.nav-i b{font-weight:600;display:block;font-size:12.5px;line-height:1.25}
.nav-i .nav-d{display:block;font-size:10.5px;line-height:1.25;color:var(--faint);font-weight:400}
/* На невысоком окне описание остаётся только у активного пункта — рельса целиком помещается без прокрутки */
@media (max-height:820px){
  .rail{gap:9px;padding:12px}
  .nav-i{min-height:34px;padding:4px 9px}
  .nav-i .nav-d{display:none}
  .nav-i.on .nav-d{display:block}
}
.tools{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;padding:3px;background:var(--surface-3);border-radius:var(--r-pill);gap:2px}
.tg button{flex:1;padding:6px 8px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;transition:all var(--t-fast)}
.tg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.mini{font-size:11px;color:var(--muted);line-height:1.4}
.kb{display:flex;flex-wrap:wrap;gap:4px}
.kb .k{padding:3px 7px;border-radius:7px;background:var(--surface-2);border:1px solid var(--stroke);font:500 10.5px/1.5 var(--f-mono);color:var(--muted)}

/* ============================= ПРИЛОЖЕНИЕ =============================== */
.app{display:flex;flex-direction:column;gap:14px;min-width:0}
.appbar{display:flex;align-items:center;gap:14px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--glass-brd);border-radius:var(--r-xl);padding:12px 16px;box-shadow:var(--shadow);position:sticky;top:18px;z-index:60}
.appbar .logo{display:flex;align-items:center;gap:9px;flex:none}
.appbar .logo img{width:32px}
.appbar .logo .wordmark{font-size:19px}
.modesel{display:flex;align-items:center;gap:10px;margin-left:6px;padding-left:14px;border-left:1px solid var(--stroke)}
.modesel .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;padding:3px;background:var(--surface-3);border-radius:var(--r-pill);gap:2px}
.seg button{padding:7px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;transition:all var(--t-fast)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button.on.easy{color:var(--mint-ink)} .seg button.on.expert{color:var(--violet-ink)}
html[data-theme="dark"] .seg button.on.easy{color:var(--mint-400)} html[data-theme="dark"] .seg button.on.expert{color:var(--violet-400)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.modesel .hint{font-size:11px;color:var(--muted);max-width:290px;line-height:1.35}
.tabs{margin-left:auto;display:flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:var(--r-pill)}
.tabs button{padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--muted);transition:all var(--t-fast)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--stroke)}
.who .av{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font:800 12px/1 var(--f-head);color:#fff;background:linear-gradient(140deg,var(--mint-400),var(--violet-400))}
.who b{font-size:12.5px;display:block} .who span{font-size:10.5px;color:var(--muted)}
.view{min-width:0}

/* =============================== АТОМЫ ================================= */
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:16px}
.card.tight{padding:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h3{font-size:14.5px}
.sec-h .lnk{font-size:12px;font-weight:600;color:var(--mint-ink)}
html[data-theme="dark"] .sec-h .lnk{color:var(--mint-400)}
.t-xs{font-size:11px}.t-sm{font-size:12.5px}.t-md{font-size:14px}
.mute{color:var(--muted)}.faint{color:var(--faint)}
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bar-ok-a,var(--mint-400)),var(--bar-ok-b,var(--mint-500)));transition:width .5s var(--e-out)}
.bar.v i{background:linear-gradient(90deg,var(--bar-v-a,var(--violet-400)),var(--bar-v-b,var(--violet-500)))}
.bar.a i{background:linear-gradient(90deg,var(--bar-warn-a,#FFC46B),var(--bar-warn-b,var(--amber)))}
.bar.r i{background:linear-gradient(90deg,var(--bar-bad-a,#FF8AA3),var(--bar-bad-b,var(--rose)))}
/* Единая шкала значений: ниже проходного балла (50) — жёлтый, от проходного — зелёный */
.val-ok{color:var(--mint-ink)} html[data-theme="dark"] .val-ok{color:var(--mint-400)}
.val-warn{color:#8A5A05} html[data-theme="dark"] .val-warn{color:var(--amber)}
.crit .st.warn{background:var(--amber-soft);color:#8A5A05} html[data-theme="dark"] .crit .st.warn{color:var(--amber)}
.divider{height:1px;background:var(--stroke-2);margin:14px 0}
.holo{background:conic-gradient(from 200deg,var(--holo-1),var(--holo-2),var(--holo-4),var(--holo-3),var(--holo-1));opacity:var(--holo-op)}

/* бейджи статуса разработки */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--mint-soft);color:var(--mint-ink)} html[data-theme="dark"] .badge.ok{color:var(--mint-400)}
.badge.demo{background:var(--sky-soft);color:#0B6E9E} html[data-theme="dark"] .badge.demo{color:#6EC8F7}
.badge.dev{background:var(--amber-soft);color:#8A5A05;border:1px dashed color-mix(in srgb,var(--amber) 45%,transparent)}
html[data-theme="dark"] .badge.dev{color:var(--amber)}
.badge.dev::before{content:"⚙";font-size:9px}
.badge.warn{background:var(--amber-soft);color:#8A5A05;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
html[data-theme="dark"] .badge.warn{color:var(--amber)}
.badge.warn::before{content:"▲";font-size:8px}
.badge.slate{background:var(--slate-soft);color:var(--muted)}
.badge.slate::before{content:"•";font-size:11px}

/* чипы */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.mint{background:var(--mint-soft);color:var(--mint-ink)}html[data-theme="dark"] .chip.mint{color:var(--mint-400)}
.chip.violet{background:var(--violet-soft);color:var(--violet-ink)}
.chip.amber{background:var(--amber-soft);color:#8A5A05}html[data-theme="dark"] .chip.amber{color:var(--amber)}
.chip.rose{background:var(--rose-soft);color:#B32246}html[data-theme="dark"] .chip.rose{color:#FF8AA3}
.chip.sky{background:var(--sky-soft);color:#0B6E9E}html[data-theme="dark"] .chip.sky{color:#6EC8F7}
.chip.pink{background:var(--pink-soft);color:#8E33B0}html[data-theme="dark"] .chip.pink{color:#E3A6F7}
.chip.slate{background:var(--slate-soft);color:var(--muted)}
/* .chip.type — цвет персоны (категория), а не оценка: читается как метка, не как тревога */
.chip.type{border:1px dashed color-mix(in srgb,currentColor 22%,transparent)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:var(--r-pill);
  font:700 13.5px/1 var(--f-head);letter-spacing:-.01em;transition:all var(--t-fast);background:var(--surface-3);color:var(--ink);border:1px solid transparent}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--mint-400),var(--mint-500));color:#062A20;box-shadow:var(--glow-mint)}
.btn.violet{background:linear-gradient(135deg,var(--violet-400),var(--violet-500));color:#fff}
.btn.ghost{background:transparent;border-color:var(--stroke)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--rose);color:#fff}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.lg{padding:14px 22px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.iconbtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--stroke);color:var(--muted);transition:all var(--t-fast)}
.iconbtn:hover{color:var(--ink);background:var(--surface-3)}
.iconbtn.on{background:var(--mint-soft);color:var(--mint-ink);border-color:transparent}

/* поля */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--stroke);background:var(--surface-2);color:var(--ink);outline:none;font-size:14px;transition:all var(--t-fast)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);background:var(--surface)}
.inp::placeholder{color:var(--faint)}
textarea.inp{resize:vertical;min-height:90px;font-family:var(--f-mono);font-size:12px;line-height:1.6}
.sw{width:44px;height:26px;border-radius:99px;background:var(--surface-3);position:relative;flex:none;transition:background var(--t-fast);cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform var(--t) var(--e-out)}
.sw.on{background:linear-gradient(135deg,var(--mint-400),var(--mint-500))}
.sw.on i{transform:translateX(18px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--stroke-2)}
.swrow:last-child{border-bottom:0}
.swrow .b b{font-size:12.5px;display:block}.swrow .b span{font-size:11px;color:var(--muted)}

/* ============================ ЭКРАН: ВХОД =============================== */
.login{max-width:460px;margin:6vh auto;display:flex;flex-direction:column;gap:18px}
.login .brand-big{display:flex;align-items:center;gap:14px}
.login .brand-big img{width:78px}
.login h1{font-size:33px;line-height:1.02}
.login p.lede{margin:0;color:var(--muted);font-size:13.5px}
.login .panel{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.err{background:var(--rose-soft);border:1px solid color-mix(in srgb,var(--rose) 35%,transparent);color:#B32246;border-radius:var(--r-md);padding:10px 12px;font-size:12.5px;margin-bottom:12px}
html[data-theme="dark"] .err{color:#FF8AA3}
.note{padding:12px;border-radius:var(--r-md);background:var(--surface-2);border:1px dashed var(--stroke);font-size:12.5px;color:var(--ink-2);line-height:1.5}

/* ========================= ЭКРАН: КОНТАКТЫ ============================== */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;border:1px solid var(--stroke);
  background:linear-gradient(135deg,var(--mint-soft),var(--violet-soft))}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{margin:0;font-size:12.5px;color:var(--muted);max-width:60%}
.hero .orb{position:absolute;right:-24px;top:-30px;width:150px;height:150px;border-radius:44px;opacity:.5}
/* Тёмная тема: ВСЕ декоративные пятна (hero контактов, баннер клиента, шапка разбора,
   hero админки) — насыщенные jewel-цвета вместо приглушённой пастели (v2.7).
   Цвета заданы один раз в --holo-* тёмной темы; здесь только насыщенность и прозрачность. */
html[data-theme="dark"] .orb.holo{filter:saturate(1.08)}
html[data-theme="dark"] .hero .orb{opacity:.38}
.hero .stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.kpi{background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--stroke);border-radius:var(--r-md);padding:9px 13px;min-width:112px}
.kpi b{font:800 21px/1 var(--f-head);display:block;letter-spacing:-.03em}
.kpi small{font-size:10.5px;color:var(--muted)}
.search{position:relative;margin:16px 0 12px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .inp{padding-left:38px;border-radius:var(--r-pill)}
.contact{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--stroke);
  width:100%;text-align:left;transition:all var(--t-fast);box-shadow:var(--shadow-sm)}
.contact:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--violet-500) 26%,var(--stroke))}
.ava{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;font:800 15px/1 var(--f-head);color:#fff;position:relative;overflow:hidden}
.ava::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.32),transparent 60%)}
.ava.l{width:66px;height:66px;border-radius:21px;font-size:20px}
.ava.s{width:38px;height:38px;border-radius:13px;font-size:12px}
.contact .who2{flex:1;min-width:0}
.contact .who2 b{display:block;font-size:14px}
.contact .who2 span{display:block;font-size:11.5px;color:var(--muted)}
.contact .go{width:38px;height:38px;border-radius:13px;background:var(--mint-soft);display:grid;place-items:center;color:var(--mint-ink);flex:none;align-self:center}
/* Аватар выровнен по имени и фамилии, высота карточки не меняется (v2.7) */
.contact .ava{align-self:flex-start}
html[data-theme="dark"] .contact .go{color:var(--mint-400)}

/* ======================= ЭКРАН: КАРТОЧКА КЛИЕНТА ======================== */
.profile{isolation:isolate;position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;border:1px solid var(--stroke);
  /* Светлая тема: баннер — пастель цвета типа клиента, а не mint/violet страницы (v2.7) */
  background:linear-gradient(140deg,color-mix(in srgb,var(--pc1,#3BF6B9) 20%,#fff),color-mix(in srgb,var(--pc2,#6C63E8) 12%,#fff))}
html[data-theme="dark"] .profile{background:linear-gradient(140deg,rgba(119,108,235,.22),rgba(59,246,185,.12))}
.profile .orb{position:absolute;right:-26px;top:-30px;width:150px;height:150px;border-radius:46px;z-index:0;opacity:calc(var(--holo-op) * .45)}
html[data-theme="light"] .profile .orb{background:conic-gradient(from 200deg,var(--pc1,#3BF6B9),var(--pc2,#6C63E8),var(--pc1,#3BF6B9));opacity:.16}
.profile .top{position:relative;z-index:2;display:flex;gap:16px;align-items:center}
.profile h2{font-size:19px;margin-bottom:3px}
.kv{display:grid;gap:9px}
.kv .r{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.kv .r span{color:var(--muted)}
.tool{display:flex;gap:10px;padding:11px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--stroke);margin-bottom:8px}
.tool .em{font-size:17px;line-height:1}
.tool b{font-size:12.5px;display:block;margin-bottom:2px}
.tool p{margin:0;font-size:11px;color:var(--muted);line-height:1.45}

/* ========================== ЭКРАН: ЗВОНОК =============================== */
.callwrap{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
.callwrap.nohint{grid-template-columns:minmax(0,1fr) 0}
.call{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.call-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--stroke-2);background:var(--call-bg)}
.timer{font:600 15px/1 var(--f-mono);background:var(--surface-2);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:7px 14px}
.rec{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--f-body);letter-spacing:.08em;color:var(--rec)}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 60%,transparent)}50%{opacity:.55;box-shadow:0 0 0 7px transparent}}
.call-id{display:flex;align-items:center;gap:12px;margin-left:auto}
.halo{position:relative;display:grid;place-items:center;width:64px;height:64px}
.halo i{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--mint-400) 55%,transparent);animation:halo 2.6s var(--e-out) infinite}
.halo i:nth-child(2){animation-delay:.85s}.halo i:nth-child(3){animation-delay:1.7s}
@keyframes halo{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.halo.paused i{animation-play-state:paused;opacity:0}
.halo .ava{width:52px;height:52px;border-radius:18px;font-size:17px;box-shadow:var(--shadow)}
.speaking{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.speaking .wv{display:flex;gap:2px;align-items:flex-end;height:12px}
.speaking .wv i{width:2.5px;border-radius:2px;background:currentColor;animation:wv .9s infinite ease-in-out}
.speaking .wv i:nth-child(2){animation-delay:.15s}.speaking .wv i:nth-child(3){animation-delay:.3s}
.speaking .wv i:nth-child(4){animation-delay:.45s}.speaking .wv i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:4px}50%{height:12px}}
.stages{display:flex;gap:6px;padding:14px 18px 0}
.stage-i{flex:1;display:flex;flex-direction:column;gap:6px;opacity:.42;transition:opacity var(--t)}
.stage-i .p{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.stage-i .p i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint-400),var(--mint-500));transition:width .6s var(--e-out)}
.stage-i .n{font-size:9.5px;font-weight:700;color:var(--muted)}
.stage-i.on{opacity:1}.stage-i.done{opacity:.9}
.stage-i.done .p i{width:100%}.stage-i.on .p i{width:52%}
.stage-i.on .n{color:var(--mint-ink)}html[data-theme="dark"] .stage-i.on .n{color:var(--mint-400)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;padding:14px 18px 0;align-items:center}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--stroke);font-size:11px;font-weight:600;color:var(--muted)}
.pill b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.pill.good{border-color:color-mix(in srgb,var(--mint-400) 50%,transparent);color:var(--mint-ink)}
html[data-theme="dark"] .pill.good{color:var(--mint-400)}
.pill.bad{border-color:color-mix(in srgb,var(--rose) 50%,transparent);color:#C42A4B}
html[data-theme="dark"] .pill.bad{color:#FF8AA3}
.mood{padding:14px 18px 0}
.mood .track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--rose) 0%,var(--amber) 30%,var(--mint-400) 70%,var(--mint-500) 100%);opacity:.9}
.mood .track i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translateX(-50%);transition:left .5s var(--e-out);box-shadow:var(--shadow-sm)}
.mood .zones{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-top:5px}
.mood .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.mood .lab b{color:var(--ink)}
.transcript{flex:1;min-height:210px;max-height:44vh;overflow-y:auto;margin:14px 18px 0;padding:14px;border-radius:var(--r-lg);
  background:var(--surface-2);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px);mask-image:linear-gradient(180deg,transparent 0,#000 14px)}
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.45;animation:bub .3s var(--e-out) both}
@keyframes bub{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub .tag{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.72;margin-bottom:4px}
.bub.you{align-self:flex-end;background:linear-gradient(135deg,var(--violet-400),var(--violet-500));color:#fff;border-bottom-right-radius:5px}
.bub.cli{align-self:flex-start;background:var(--surface);border:1px solid var(--stroke);border-bottom-left-radius:5px}
.bub.sys{align-self:center;max-width:94%;text-align:center;font-size:11.5px;font-weight:600;background:var(--amber-soft);color:#8A5A05}
html[data-theme="dark"] .bub.sys{color:var(--amber)}
.bub.sys.warn{background:var(--sky-soft);color:#0B6E9E}
html[data-theme="dark"] .bub.sys.warn{color:#6EC8F7}
.typing{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--stroke)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 12px;border-radius:var(--r-pill);
  background:var(--surface-2);border:1px solid var(--stroke);font-size:11.5px;font-weight:600;color:var(--muted);transition:all var(--t-fast)}
.quick button:hover{color:var(--ink);border-color:var(--accent)}
/* Бейдж этапа на быстрой фразе: видно, к какому этапу она подходит (баллы — только на своём) */
.quick button .st{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:99px;background:var(--surface-3);
  color:var(--muted);font:700 9.5px/1 Inter;vertical-align:1px}
.quick button.off{opacity:.62}                      /* фраза чужого этапа: остаётся кликабельной, но баллов не даёт */
.quick button.off .st{background:var(--amber-soft);color:#8A5A05}
html[data-theme="dark"] .quick button.off .st{color:var(--amber)}
.reply{display:flex;gap:9px;align-items:center;padding:14px 18px 18px}
.reply .inp{border-radius:var(--r-pill);padding:13px 18px}
.ctrl{display:flex;gap:8px;align-items:center}
.cbtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--stroke);color:var(--muted);flex:none;transition:all var(--t-fast)}
.cbtn:hover{color:var(--ink);transform:translateY(-1px)}
.cbtn.micprimary{width:56px;height:56px;border-radius:20px;background:linear-gradient(140deg,var(--mint-400),var(--mint-500));color:#062A20;border:0;box-shadow:var(--glow-mint)}
.cbtn.rec{background:linear-gradient(140deg,#FF6B88,var(--rose));color:#fff;border:0;box-shadow:0 0 0 10px color-mix(in srgb,var(--rose) 16%,transparent)}
.cbtn.hint{background:var(--amber-soft);color:#8A5A05;border-color:transparent}
html[data-theme="dark"] .cbtn.hint{color:var(--amber)}
.cbtn.end{background:var(--rose);color:#fff;border:0}
.cbtn[disabled]{opacity:.4;pointer-events:none}

/* панель подсказки (десктоп) */
.hintpanel{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;position:sticky;top:96px}
.hintpanel .hd2{padding:14px 16px;border-bottom:1px solid var(--stroke-2);background:linear-gradient(135deg,var(--mint-soft),var(--violet-soft));display:flex;align-items:center;justify-content:space-between;gap:10px}
.hintpanel .body{padding:14px 16px;max-height:calc(100vh - 260px);overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.hint-step{display:flex;gap:11px;padding:11px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--stroke)}
.hint-step .num{width:24px;height:24px;border-radius:9px;background:var(--violet-soft);color:var(--violet-ink);display:grid;place-items:center;font:800 11px/1 var(--f-head);flex:none}
.hint-step b{font-size:12.5px;display:block;margin-bottom:2px}
.hint-step p{margin:0;font-size:11px;color:var(--muted);line-height:1.45}
.phrase{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--stroke);font-size:11.5px;margin-bottom:6px;transition:all var(--t-fast)}
.phrase:hover{border-color:var(--accent);background:var(--surface-3)}
.phrase .q{color:var(--faint);font-family:var(--f-mono)}
.check-item{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;padding:5px 0}
.check-item .dot{width:16px;height:16px;border-radius:6px;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center;flex:none;margin-top:1px}
html[data-theme="dark"] .check-item .dot{color:var(--mint-400)}
.dont{padding:11px;border-radius:var(--r-md);background:var(--rose-soft);color:#B32246;font-size:11.5px;line-height:1.5}
html[data-theme="dark"] .dont{color:#FF8AA3}

/* ========================= ЭКРАН: СРЫВ ================================= */
.sryv{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--stroke);background:linear-gradient(150deg,#1A1020,#0B0D13 60%);color:#F1F4FA;padding:44px 28px;text-align:center;box-shadow:var(--shadow-lg)}
.sryv .ring{width:110px;height:110px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:rgba(242,80,110,.16);border:1.5px solid rgba(242,80,110,.5);animation:shake .5s var(--e-out) 1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sryv h2{font-size:26px;margin-bottom:8px}
.sryv p{color:#B9C0D4;font-size:13.5px;margin:0 auto 8px;max-width:52ch}
.sryv .reason{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-pill);padding:8px 14px;font-size:12.5px;margin-top:8px}
.beeps{display:flex;gap:5px;justify-content:center;margin:18px 0 6px}
.beeps i{width:4px;height:22px;border-radius:2px;background:var(--rose);opacity:.9;animation:beep 1.1s infinite}
.beeps i:nth-child(2){animation-delay:.25s;width:22px;height:4px;border-radius:2px;margin-top:9px}
.beeps i:nth-child(3){animation-delay:.5s}.beeps i:nth-child(4){animation-delay:.75s;width:22px;height:4px;margin-top:9px}
@keyframes beep{0%,100%{opacity:.25}50%{opacity:1}}

/* ========================= ЭКРАН: РАЗБОР =============================== */
.score-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;border-radius:var(--r-xl);padding:20px;border:1px solid var(--stroke);
  background:linear-gradient(135deg,var(--mint-soft),var(--violet-soft));position:relative;overflow:hidden}
.score-hero .orb{position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;border-radius:52px;opacity:.4}
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap .val{position:absolute;text-align:center}
.ring-wrap .val b{font:800 24px/1 var(--f-head);letter-spacing:-.03em;display:block}
.ring-wrap .val span{font-size:9.5px;color:var(--muted)}
.crit{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--stroke-2)}
.crit:last-child{border-bottom:0}
.crit .st{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none}
.crit .st.ok{background:var(--mint-soft);color:var(--mint-ink)}html[data-theme="dark"] .crit .st.ok{color:var(--mint-400)}
.crit .st.mid{background:var(--amber-soft);color:#8A5A05}html[data-theme="dark"] .crit .st.mid{color:var(--amber)}
.crit .st.bad{background:var(--rose-soft);color:#B32246}html[data-theme="dark"] .crit .st.bad{color:#FF8AA3}
.crit .bd{flex:1;min-width:0}
.crit .bd b{font-size:12.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crit .bd p{margin:3px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
.crit .sc{font:600 12px/1 var(--f-mono)}
.traj{width:100%;height:150px;display:block}
.dlg{display:flex;flex-direction:column;gap:9px}
.dlg .m{display:flex;gap:10px;font-size:12.5px;line-height:1.45}
.dlg .m b{flex:none;width:78px;font-size:10.5px;font-weight:700;padding-top:2px}
.dlg .m.you b{color:var(--violet-ink)}.dlg .m.cli b{color:var(--mint-ink)}
html[data-theme="dark"] .dlg .m.cli b{color:var(--mint-400)}
.dlg .m.ref{background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-left:-10px}
.dl{display:flex;gap:11px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--stroke);width:100%;text-align:left;transition:all var(--t-fast)}
.dl:hover{border-color:var(--accent)}
.dl b{font-size:12.5px;display:block}.dl span{font-size:10.5px;color:var(--muted)}
.dl .ic-wrap{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none}

/* ========================== ЭКРАН: ЖУРНАЛ ============================== */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.inp{padding:8px 12px;font-size:12px;border-radius:var(--r-pill);width:auto;min-width:130px}
.ses{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--stroke);width:100%;text-align:left;transition:all var(--t-fast)}
.ses:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ses .bd b{font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ses .bd span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
/* Уровень — индикатор и название одной строкой, без переноса между точкой и словом (v2.7) */
.ses .ses-mode{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--muted);margin-top:2px}
.ses .ses-mode span{display:inline;margin:0}
.warnbar{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);
  color:#8A5A05;border-radius:var(--r-md);padding:10px 13px;font-size:12px}
html[data-theme="dark"] .warnbar{color:var(--amber)}

/* ========================== ЭКРАН: АДМИН ============================== */
.atabs{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--surface-3);border-radius:18px}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;padding:8px 13px;border-radius:var(--r-pill);font-size:12px;font-weight:600;color:var(--muted);transition:all var(--t-fast)}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{padding:6px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--stroke);color:var(--muted)}
.subtabs button.on{background:var(--ink);color:var(--surface);border-color:transparent}

/* ===== ЧИТАЕМОСТЬ И КОНТРАСТ (правки куратора, 19.10.2026, v2.10) =====
   Слой оформлен точечно: только приложение (.app), панель навигации не затрагивается.
   Что даёт: приглушённый и слабый текст в светлой теме поднимаются с 3.0 до 5.0-6.4
   (норма WCAG AA — от 4.5), в тёмной — с 3.8 до 6.9-8.1; кнопка «Завершить» получает
   белый текст на #B92449 (было 3.4, стало 6.2); поля и кнопки — границы заметнее,
   минимальная высота 44 px (удобно и пальцем, и мышкой), видимый фокус 3 px.
   Отклонено: скрытие подсказки режима на ширине до 1600 px — подсказка обязательна
   по ТЗ (режимы «Легко/Эксперт»), порог снижен до 1120 px. */
/* Улучшения читаемости ограничены приложением: боковая панель не затрагивается. */
html[data-theme="light"] .app{
  --ink:#192337;--ink-2:#3B4960;--muted:#526078;--faint:#667085;
  --control-border:#7B879D;--danger-bg:#B92449;--info-bg:#F4F2FC;--info-border:#D9D2F0;--info-ink:#4F486B;
  /* Цвета полос и кольца, светлая тема (v2.10, референсы Елены): оранжевый #F88F41,
     зелёный #07745A, градиент — от более тёмного слева к более светлому справа.
     Справа: зелёный #039468, оранжевый #F88F41. Тёмную тему не трогаем. */
  --bar-ok-a:#07745A;   --bar-ok-b:#039468;
  --bar-warn-a:#D9701A; --bar-warn-b:#F88F41;
  --bar-bad-a:#B92449;  --bar-bad-b:#F2506E;
  --bar-v-a:#6C63E8;    --bar-v-b:#A79DFF;
  --ring-ok-a:var(--bar-ok-a);   --ring-ok-b:var(--bar-ok-b);
  --ring-warn-a:var(--bar-warn-a); --ring-warn-b:var(--bar-warn-b);
}
html[data-theme="dark"] .app{
  --muted:#B3BDD1;--faint:#97A2B8;--control-border:#7C89A3;--danger-bg:#B92449;
  --info-bg:#252237;--info-border:#756A9C;--info-ink:#D9D2EC;
  /* Тёмная тема оставлена как была (v2.10): градиенты по прежним токенам мяты и фиолета. */
  --bar-ok-a:var(--mint-400);   --bar-ok-b:var(--mint-500);
  --bar-warn-a:#FFC46B;         --bar-warn-b:var(--amber);
  --bar-bad-a:#FF8AA3;          --bar-bad-b:var(--rose);
  --bar-v-a:var(--violet-400);  --bar-v-b:var(--violet-500);
  --ring-ok-a:var(--mint-500);  --ring-ok-b:var(--mint-500);
  --ring-warn-a:var(--amber);   --ring-warn-b:var(--amber);
}
.app .t-xs,.app .mini{font-size:13px;line-height:1.5}
.app .t-sm{font-size:14px;line-height:1.5}
.app .field>span{font-size:13px}
.app .badge,.app .chip{font-size:12px;line-height:1.4}
.app .btn{min-height:44px;font-size:14px;line-height:1.25}
.app .btn.sm{font-size:13px;min-height:40px}
.app .btn.danger{background:var(--danger-bg);color:#fff}
.app .cbtn.end{background:var(--danger-bg);color:#fff}
.app .btn.ghost,.app .inp{border-color:var(--control-border)}
.app .inp::placeholder{color:var(--muted);opacity:1}
.app select.inp{min-height:44px;font-size:14px}
.app textarea.inp{font-size:14px;line-height:1.6}
.app .inp:focus{border-color:var(--accent)}
.app :is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app .modesel .lbl,.app .who span{font-size:12px}
.app .modesel .hint{font-size:13px;line-height:1.45;max-width:270px}
.app .tabs button,.app .seg button{font-size:14px;min-height:40px}
.app .who b{font-size:14px}
.app .appbar{flex-wrap:wrap}
.app .note,.app .tool p,.app .tool>div>span,.app .speaking{font-size:13px;line-height:1.5}
.app .ring-wrap .val span{font-size:12px}
html[data-theme="light"] .tabbar button{color:#526078;font-size:12px;min-height:44px}
html[data-theme="dark"] .tabbar button{color:#B3BDD1;font-size:12px;min-height:44px}
html[data-theme="light"] .tabbar button.on{color:#07745A}
html[data-theme="dark"] .tabbar button.on{color:#3BF6B9}
@media(max-width:820px){.app .view{padding-bottom:100px}}
html[data-device="phone"] .app .view,html[data-device="tablet"] .app .view{padding-bottom:100px}
/* Светлая тема: плоские цвета #087D63 и #94610C (первая редакция правок) заменены на
   градиенты — янтарь в сплошной заливке уходил в коричневый и не совпадал с кольцом разбора. */
@media(max-width:1120px){.app .modesel .hint{display:none}}

.app .journal-page{container-type:inline-size}
.app .journal-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:8px 0 22px}
.app .journal-heading h1{font-size:28px;line-height:1.2;margin-bottom:7px}
.app .journal-heading p{font-size:14px;color:var(--muted);margin:0}
.app .journal-heading .btn{flex:none}
.app .journal-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.app .journal-summary .card{padding:22px;min-width:0}
.app .journal-summary h2{font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.015em;margin:0 0 15px}
.app .journal-summary .score-row{display:flex;align-items:center;gap:16px;margin:0 0 10px}
.app .journal-summary .average{font:800 40px/1.2 var(--f-head);letter-spacing:-.04em}
.app .journal-summary .bar{flex:1;height:9px}
.app .journal-summary .metric-note{font-size:13px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.app .journal-summary .status-chips{display:flex;gap:8px;flex-wrap:wrap}
.app .journal-summary .chip{font-size:13px}
.app .storage-info{display:flex;align-items:center;gap:12px;padding:14px 17px;border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-ink);border-radius:14px;font-size:14px;line-height:1.5;margin-bottom:18px;flex-wrap:wrap}
.app .storage-info>span:first-of-type{flex:1;min-width:220px}
.app .storage-info .badge.dev{background:transparent;color:var(--info-ink);border-color:var(--info-border);white-space:normal}
.app .journal-filter-card{padding:20px 22px;margin-bottom:24px;position:sticky;top:calc(18px + var(--appbar-h,74px) + 10px);z-index:40;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.3)}
.app .journal-day{font:700 11px/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--stroke-2)}
.app .journal-more{display:flex;justify-content:center;margin-top:18px}
.app .journal-section-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.app .journal-section-heading h2{font-size:16px;line-height:1.3;letter-spacing:-.015em}
.app .journal-section-heading small{font-size:13px;color:var(--muted)}
.app .journal-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end}
.app .journal-filters label{min-width:0}
.app .journal-filters label>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.app .journal-filters select.inp{width:100%;min-width:0;min-height:44px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:14px}
.app .journal-filters .btn{min-height:44px;border-radius:10px}
.app .journal-list-heading{margin:0 2px 12px}
.app .ses.journal-session{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(150px,.8fr) minmax(130px,.65fr) auto;gap:20px;padding:22px;align-items:center;margin-bottom:12px}
.app .journal-contact{display:flex;gap:14px;align-items:center;min-width:0}
.app .journal-contact-copy{display:block;min-width:0}
.app .journal-name{display:block;font-size:17px;font-weight:750;line-height:1.4}
.app .journal-contact-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px;margin-top:4px}
.app .journal-contact-meta .ses-mode{margin:0;font-size:14px;display:inline-flex;gap:5px}
.app .journal-contact-copy>.ses-mode{display:inline-flex;gap:5px;margin-top:4px;font-size:14px;color:var(--muted)}
.app .journal-name .badge{font-size:12px;vertical-align:2px;margin-left:7px}
.app .journal-session-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.app .journal-session-tags .badge,.app .journal-session-tags .chip{font-size:12px}
.app .journal-date{display:block;font-size:14px;line-height:1.5}
.app .journal-date b{display:block;font-weight:600}
.app .journal-date>span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.app .journal-result{display:block;border-left:1px solid var(--stroke);padding-left:20px}
.app .journal-result>b{font:800 30px/1.2 var(--f-head);display:block;white-space:nowrap}
.app .journal-result>b>small{font:500 14px/1.4 var(--f-body);color:var(--muted);margin-left:5px}
.app .journal-result>span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.app .journal-open{display:inline-flex;gap:9px;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--mint-ink);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:700;color:var(--mint-ink);white-space:nowrap}
.app .journal-open .ic{transform:rotate(180deg);width:16px;height:16px}
.app .journal-session:hover .journal-open{background:var(--mint-soft)}
.app .journal-session:focus-visible{outline-offset:3px}
.app .journal-empty{text-align:center;padding:32px}
.app .journal-empty p{font-size:14px;color:var(--muted)}
@container(max-width:1000px){
  .app .journal-filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app .journal-filters .btn{justify-self:start}
  .app .ses.journal-session{grid-template-columns:minmax(0,1fr) auto;gap:18px}
  .app .journal-contact{grid-column:1;grid-row:1}
  .app .journal-date{grid-column:1;grid-row:2}
  .app .journal-result{grid-column:2;grid-row:1}
  .app .journal-open{grid-column:2;grid-row:2}
}
@container(max-width:720px){
  .app .journal-summary{grid-template-columns:minmax(0,1fr)}
  .app .journal-heading{align-items:flex-start;flex-direction:column}
  .app .journal-heading h1{font-size:25px}
  .app .journal-summary .card{padding:18px}
}
@container(max-width:440px){
  .app .journal-filters{grid-template-columns:minmax(0,1fr)}
  .app .journal-filters .btn{width:100%}
  .app .journal-filter-card{padding:18px}
  .app .ses.journal-session{grid-template-columns:minmax(0,1fr);padding:18px}
  .app .journal-contact,.app .journal-date,.app .journal-result,.app .journal-open{grid-column:auto;grid-row:auto}
  .app .journal-result{padding-left:0;border-left:0;padding-top:14px;border-top:1px solid var(--stroke)}
  .app .journal-open{width:100%}
  .app .journal-section-heading{align-items:flex-start;flex-wrap:wrap}
}

/* ================= 00. ПОДКЛЮЧЕНИЕ СЕРВИСОВ (ENV) =========================
   ТОЧКА ПОДКЛЮЧЕНИЯ — единственное место, которое заполняется при развёртывании.
   Пока поля пустые, прототип работает в демо-режиме: ничего не ломается и не
   требует ни интернета, ни сервера. Заполненные поля включают реальный сервис.
   СЕКРЕТЫ СЮДА НЕ ВПИСЫВАТЬ: GEMINI_API_KEY, пароли БД и хранилища живут
   только на сервере в .env; браузеру отдаём лишь путь к нашему прокси.
   Пошаговые инструкции: docs/Чеклист-ресурсов-подключения.md, README → «Как подключить». */
/* DEPLOY — флаг «деплойной» сборки (tools/build.py --deploy). В рабочем прототипе false:
   видно всё, включая демо-панель и экран «Статус готовности». В деплойной сборке true:
   левая панель, экран статуса и демо-артефакты вырезаны, вход — по двум демо-адресам,
   в интерфейсе честно написано, что живые голоса Silero появятся на сервере компании. */
const DEPLOY=true;
const ENV={
  apiBase:'https://dozvon-llm.hellnazenberg.workers.dev',                          // напр. '/api' — наш прокси. Пусто → демо-режим
  llm:{provider:'',model:'gemini-3.5-flash',timeoutMs:10000,endpoint:'/llm/turn',token:'pesochnica'},  // GEMINI_API_KEY — на сервере
  tts:{endpoint:'',voice:'baya'},      // '/api/tts' → Silero (голос клиента)
  stt:{endpoint:''},                   // 'wss://dozvon.brinex.ru/api/stt' → Vosk
  rec:{endpoint:'',keepDays:30},       // '/api/recordings' → S3/Drive. Пусто → запись в браузере
  files:{endpoint:''},                 // '/api/files' → разбор pdf/pptx/xlsx на сервере
  report:{endpoint:''},                // '/api/report.xlsx' → openpyxl с графиками
  auth:{mode:'demo'},                  // demo | list | sso
  drive:{folderId:''}                  // папка Google Drive для аудио (если выбран Драйв)
};
/* Подключён ли сервис — используется в «Статусе готовности» и вкладке «Сервисы и доступ» */
function svcReady(k){const v=ENV[k]||{};if(k==='auth')return ENV.auth.mode!=='demo';return !!ENV.apiBase&&!!(v.endpoint||k==='llm')}

/* ================= 00.1. ДОСТУП: РОЛИ И УЧЁТНЫЕ ЗАПИСИ ===================
   Модель доступа: два суперадмина (руководитель обучения и начальник отдела)
   и админские доступы (РОП — статистика и записи; технический — сервисы).
   Роль каждой учётки меняется в админке («Сервисы и доступ»), без правки кода. */
const ROLES={
  superadmin:{n:'Суперадмин', d:'Полный доступ: контент, критерии, версии, сервисы, учётные записи'},
  admin:{n:'Админ',          d:'Статистика, отчёты и записи; контент — только чтение'},
  manager:{n:'Менеджер',     d:'Тренировка, свой разбор и личная статистика'}
};
const ACCOUNTS_SEED=[
  {email:'training@brinex.ru',n:'Руководитель отдела обучения',       role:'superadmin',note:'владелец тренажёра'},
  {email:'head@brinex.ru',    n:'Начальник отдела обучения',          role:'superadmin',note:''},
  {email:'rop@brinex.ru',     n:'Руководитель отдела оптовых продаж', role:'admin',     note:'статистика и записи своей команды'},
  {email:'dev@brinex.ru',     n:'Технический админ (разработчик)',    role:'admin',     note:'сервисы, версии, импорт/экспорт'}
];
/* Роль вошедшего: по учётной записи, иначе менеджер по умолчанию */
function roleFor(mail){
  const a=(S.accounts||[]).find(x=>norm(x.email)===norm(mail));
  return (a&&a.role)||'manager';
}
function roleInfo(role){return ROLES[role]||ROLES.manager}
/* Служебные пометки (в том числе «реплику писал ИИ») видит методист и админ.
   Менеджеру они не нужны: в его разборе только его own результат. */
function methodistView(){return !(S.me&&S.me.role==='manager')}
/* Вошёл ли человек. Пока почты в профиле нет — он на экране входа, и никаких
   других экранов, табов и переходов ему не показываем. */
function loggedIn(){return !!(S.me&&S.me.email)}

/* ================= 00.2. АДАПТЕРЫ СЕРВИСОВ (демо ↔ сервер) ===============
   Логика звонка не знает, откуда приходят данные: в демо-режиме работает
   локальный движок, при подключении — сервер с тем же контрактом. Поэтому
   баллы, этапы, настрой и антифарм не меняются при подключении ИИ.
   Контракт ответа сервера (можно реализовать на любом стеке):
     POST {apiBase}/llm/turn
       → { reply:"реплика клиента", mood_delta:-8, stage_advance:true,
           tags:{ open_q:1, closed_q:0, ack:false, argue:false, impose:false,
                  truth:false, next_step:true, tools:["ack","truth"],
                  mistakes:["монолог"] } }
   Если сервер молчит/ошибка/таймаут — возвращаем null и берём локальный
   результат: это и есть фолбэк без наказания (механика 7 ТЗ). */
async function LLM_turn(payload){
  if(!svcReady('llm'))return null;                        /* демо: считаем локально */
  try{
    const ctl=new AbortController();
    const t=setTimeout(()=>ctl.abort(),ENV.llm.timeoutMs||8000);
    const h={'Content-Type':'application/json'};
    /* Ключ Gemini живёт в секретах Cloudflare-воркера; браузер передаёт только кодовое слово. */
    if(ENV.llm.token)h['X-Dozvon-Token']=ENV.llm.token;
    const r=await fetch(ENV.apiBase+(ENV.llm.endpoint||'/llm/turn'),{method:'POST',
      headers:h,body:JSON.stringify(payload),signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){return null}                                  /* → фолбэк, без штрафа пользователю */
}
/* ================= 00.2b. ИИ ПИШЕТ РЕПЛИКУ КЛИЕНТА ========================
   Разделение такое: ИИ сочиняет только слова клиента. Всё, что превращается
   в баллы, — критерии, зачёт этапа, настрой, промахи — считает наш движок.
   Почему так:
     · оценка остаётся одинаковой при живом ИИ и при локальном сценарии;
     · сбой связи или таймаут никого не наказывает (механика 7 ТЗ): не успел
       ответ — молча берём сценарий, баллы не меняются;
     · модель не может «нарисовать» себе баллы или зачесть этап.
   Контракт ответа: {ok:true, text:'...'}. Всё остальное — как локальный движок. */

/* Собираем роль клиента, историю и реплику менеджера. turn — опорная реплика
   сценария: модель может её перефразировать, но должна сохранить смысл. */
function buildLLMPayload(s,text,c,turn){
  /* Реплика менеджера уже лежит в s.turns последней — в историю её не берём,
     иначе модель увидит её дважды (в истории и как текущий запрос). */
  const past=s.turns.filter(t=>t.who==='you'||t.who==='cli');
  if(past.length&&past[past.length-1].who==='you')past.pop();
  const history=past.slice(-6)
    .map(t=>(t.who==='you'?'Менеджер: ':'Клиент: ')+t.txt).join('\n');
  const moodTone = s.mood<35?'раздражён, отвечай суше и короче'
                 : s.mood>70?'расположен к разговору'
                 : 'держишься нейтрально';
  const system=[
    'Ты — '+c.name+', '+c.role+' компании «'+c.company+'». Ты отвечаешь по телефону менеджеру по оптовым продажам.',
    'Тип клиента: '+c.type+'.',
    'Твой контекст: '+c.hist,
    'Что тебя раздражает: '+c.risk,
    'Твоя цель в разговоре: '+c.goal,
    'Как ты держишься: '+c.prompt.rules,
    'Сейчас этап разговора: '+stageName(stageIdx(s))+'.',
    'Твой настрой: '+s.mood+' из 100 — '+moodTone+'.',
    'Правила ответа: одна реплика, 1–3 предложения, живой разговорный русский, без канцелярита.',
    'Не соглашайся сразу, не подыгрывай менеджеру, не задавай вопросы вместо ответа на его вопрос.',
    'Не пиши пояснений, ремарок, имён и реплик за менеджера. Не выходи из роли, не упоминай, что ты ИИ.',
    'Без кавычек, смайлов, ссылок и форматирования — только сама реплика, одним абзацем.',
    'Запрещено: списки, нумерация, маркеры, заголовки, пояснения в скобках и звёздочках.',
    'Это телефонный разговор: никаких «1. Стабильность поставок» — только живая речь, как человек на связи.',
    turn&&turn.llm?('Опорная реплика по сценарию (можно перефразировать, смысл сохрани): '+turn.llm):''
  ].filter(Boolean).join('\n');
  return {
    system,
    model:ENV.llm.model,
    messages:[{role:'user',text:(history?('История:\n'+history+'\n\n'):'')+'Менеджер: '+text}],
    /* prompt — на случай, если прокси ждёт один плоский текст (так делает наш воркер) */
    prompt:(history?('История диалога:\n'+history+'\n\n'):'')+'Менеджер: '+text+'\nКлиент:'
  };
}

/* Чистим ответ модели. Вернули строку — берём её; вернули null — работает сценарий. */
function llmClean(t){
  if(!t||typeof t!=='string')return null;
  /* Список вместо реплики (видели живьём: «1. Стабильность поставок. 2. …») —
     это не речь человека на телефоне. Проверяем до схлопывания пробелов. */
  const bullets=(t.match(/(^|\n)\s*(?:[-•*]|\d+[.)])\s+/g)||[]).length;
  if(bullets>=2)return null;
  let x=t.trim()
    .replace(/^[\s"'`«»„“]+|[\s"'`«»„“]+$/g,'')     /* кавычки и пробелы по краям */
    .replace(/\*\*|__|`/g,'')                          /* обрывки разметки — до ремарок, иначе «**Важно:**» не снимается */
    .replace(/\([^)]*\)|\[[^\]]*\]|\*[^*]*\*/g,' ') /* ремарки в скобках и звёздочках */
    .replace(/^(Клиент|Клиентка|Ответ|Реплика|Важно|Примечание|Пример)\s*[:\-—]\s*/i,'')
    .replace(/^\s*(?:[-•*]|\d+[.)])\s+/,'')            /* если маркер всё же один — снимаем */
    .replace(/^#{1,6}\s*/,'')                            /* заголовок */
    .replace(/\s+/g,' ')
    .trim()
    .replace(/^[а-яё]/,m=>m.toUpperCase());              /* первая буква — заглавная */
  if(!x)return null;
  if(/https?:\/\//i.test(x))return null;                  /* ссылки в реплике не нужны */
  if(/(я искусственн|как ии|language model|openai|gemini|chatgpt)/i.test(x))return null;
  /* Почти без русских букв — значит, модель написала не речь (бывало живьём) */
  const all=x.match(/[a-zа-яё]/gi)||[], cyr=x.match(/[а-яё]/gi)||[];
  if(!cyr.length||cyr.length/all.length<0.6)return null;
  if(x.split(/\s+/).length<3)return null;                 /* обрывок, а не реплика */
  if(x.length>320)x=x.slice(0,320).replace(/\s+\S*$/,'')+'…';
  /* Модель иногда не дописывает фразу (кончились токены): такой обрывок
     давать в эфир нельзя — лучше сценарий. Если есть законченная часть,
     берём её; если нет ни одного знака конца — отвергаем. */
  if(!/[.!?…»"')\]]$/.test(x)){
    const cut=Math.max(x.lastIndexOf('.'),x.lastIndexOf('!'),x.lastIndexOf('?'));
    if(cut>60)x=x.slice(0,cut+1);
    else if(x.length>60)return null;
  }
  return x;
}

/* Материалы: нарезка выдержек под запрос. Демо — поиск по ключевым словам,
   сервер (после подключения) — векторный поиск по pgvector. */
function materialExcerpts(query,top){
  const words=norm(query).split(/\s+/).filter(w=>w.length>3);
  const out=[];
  (S.materials||[]).forEach(m=>{
    if(!m.inLLM||!m.text)return;
    const t=String(m.text);
    let score=0;words.forEach(w=>{if(norm(t).includes(w))score++});
    if(score)out.push({n:m.n,score,txt:t.slice(0,600)});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,top||3);
}

/* ================= 00.3. МИНИ-ZIP И XLSX БЕЗ СЕРВЕРА =====================
   XLSX — это zip с XML внутри. Пишем его сами (без библиотек и без сети),
   чтобы отчёт работал офлайн; графики добавит серверный openpyxl. */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
/* zipStore([{name,data:Uint8Array}]) → Blob (метод 0, без сжатия) */
function zipStore(files){
  const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name),crc=crc32(f.data),len=f.data.length;
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,len,true);dv.setUint32(22,len,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);lh.set(name,30);
    chunks.push(lh,f.data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,len,true);cv.setUint32(24,len,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    ch.set(name,46);central.push(ch);offset+=lh.length+len;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob([...chunks,...central,end],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function colRef(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-1-m)/26}return s}
/* sheets: [{name, rows:[[значение,…],…]}] — числа пишутся числами, текст строками */
function buildXLSX(sheets){
  const enc=new TextEncoder();
  const sheetXml=sheets.map((sh,si)=>{
    const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
      const ref=colRef(ci)+(ri+1);
      if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t>${xesc(v)}</t></is></c>`;
    }).join('')+'</row>').join('');
    return {n:'sheet'+(si+1)+'.xml',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows}</sheetData></worksheet>`};
  });
  const files=[
    {name:'[Content_Types].xml',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheetXml.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh,i)=>`<sheet name="${xesc(sh.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',x:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((sh,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`}
  ].concat(sheetXml.map(s=>({name:'xl/worksheets/'+s.n,x:s.x})));
  return zipStore(files.map(f=>({name:f.name,data:enc.encode(f.x)})));
}

/* ================= 00.4. РАЗБОР ФАЙЛОВ МАТЕРИАЛОВ (txt/md/docx) ==========
   Работает офлайн, без сервера. pdf/pptx/xlsx разбирает сервер после подключения. */
async function zipRead(buf){
  const u8=new Uint8Array(buf),dv=new DataView(u8.buffer);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('не zip');
  const cnt=dv.getUint16(eocd+10,true),cdOff=dv.getUint32(eocd+16,true),out={};
  let p=cdOff;
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true);
    const extra=dv.getUint16(p+30,true),cmt=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nlen));
    const lnlen=dv.getUint16(lho+26,true),lextra=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lextra,raw=u8.slice(start,start+csize);
    if(method===0)out[name]=raw;
    else if(method===8){                                     /* deflate → DecompressionStream */
      if(typeof DecompressionStream==='undefined')throw new Error('нужен браузер с DecompressionStream');
      const ds=new DecompressionStream('deflate-raw');
      const blob=new Blob([raw]).stream().pipeThrough(ds);
      out[name]=new Uint8Array(await new Response(blob).arrayBuffer());
    }
    p+=46+nlen+extra+cmt;
  }
  return out;
}
async function parseMaterialFile(file){
  const ext=((file.name||'').split('.').pop()||'').toLowerCase();
  try{
    if(['txt','md','csv','json','markdown'].includes(ext)){
      return {ok:true,kind:ext.toUpperCase(),text:(await file.text()).slice(0,20000)};
    }
    if(ext==='docx'){
      const parts=await zipRead(await file.arrayBuffer());
      const doc=parts['word/document.xml'];
      if(!doc)throw new Error('в docx нет word/document.xml');
      const xml=new TextDecoder().decode(doc)
        .replace(/<w:p[ >]/g,'\n<w:p ').replace(/<\/w:p>/g,'\n')
        .replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,' ')
        .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
      return {ok:true,kind:'DOCX',text:xml.replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim().slice(0,20000)};
    }
    if(['pdf','pptx','xlsx'].includes(ext))
      return {ok:false,kind:ext.toUpperCase(),why:'этот формат разбирает сервер после подключения (ENV.files)'};
    return {ok:false,kind:ext.toUpperCase()||'файл',why:'формат не поддержан'};
  }catch(e){return {ok:false,kind:ext.toUpperCase(),why:e.message||'не удалось прочитать файл'}}
}

/* ================= 00.5. ЛОКАЛЬНАЯ ЗАПИСЬ ЗВОНКА =========================
   Запись делает браузер (MediaRecorder) — работает без сервера. Blob живёт
   в памяти вкладки; серверное хранение и автоочистка 30 дней подключаются
   адаптером позже (ENV.rec). */
const RECFILES={};                       /* id сессии → Blob (демо-хранилище вкладки) */
let RECORDER=null,RECSTREAM=null,RECCHUNKS=[];
async function recStart(){
  if(typeof navigator==='undefined'||!navigator.mediaDevices||typeof window==='undefined'||!window.MediaRecorder)
    return {ok:false,why:'браузер не отдаёт доступ к записи'};
  try{
    RECSTREAM=await navigator.mediaDevices.getUserMedia({audio:true});
    RECCHUNKS=[];RECORDER=new window.MediaRecorder(RECSTREAM);
    RECORDER.ondataavailable=e=>{if(e.data&&e.data.size)RECCHUNKS.push(e.data)};
    RECORDER.start(1000);
    return {ok:true};
  }catch(e){return {ok:false,why:'нет доступа к микрофону'}}
}
function recStop(id){
  return new Promise(res=>{
    if(!RECORDER||RECORDER.state==='inactive'){res(null);return}
    RECORDER.onstop=()=>{
      try{if(RECCHUNKS.length)RECFILES[id]=new Blob(RECCHUNKS,{type:RECORDER.mimeType||'audio/webm'})}catch(e){}
      try{RECSTREAM&&RECSTREAM.getTracks().forEach(t=>t.stop())}catch(e){}
      RECORDER=null;RECSTREAM=null;res(RECFILES[id]||null);
    };
    try{RECORDER.stop()}catch(e){res(null)}
  });
}
function recUrl(id){try{return RECFILES[id]&&typeof URL!=='undefined'&&URL.createObjectURL?URL.createObjectURL(RECFILES[id]):''}catch(e){return ''}}

/* ================= 00.6. АКТИВНОСТЬ И ТАЙМАУТ 15 МИНУТ ==================
   Считаем на клиенте: любое действие сбрасывает счётчик, 15 минут тишины
   завершают сессию как «прерван». Сервер в дальнейшем будет только учитывать. */
let LAST_ACT=Date.now();
function touchAct(){LAST_ACT=Date.now()}
function idleMinutes(){return (Date.now()-LAST_ACT)/60000}
function idleLimitMin(){return (S&&S.timeoutMin)||15}
/* Офлайн-режим: прототип полностью работает без сети — показываем это честно */
function netOnline(){try{return typeof navigator==='undefined'||navigator.onLine!==false}catch(e){return true}}
/* Текущий этап разговора как индекс 0–4.
   Важно: s.stage — это «сколько этапов пройдено», после закрытия он равен 5.
   Для сопоставления с этапом фразы его всегда надо приводить к индексу (иначе фраза «Закрытие»
   на пройденном закрытии сравнивается 4 ≠ 5 и ложно считается «не по этапу»).
   Единая точка правды: stageIdx(). */
/* Имя этапа без падений: если методист удалил этап, показываем порядковый номер */
function stageName(k){const st=S.stages[k];return st?st.n:('этап '+(Number(k)+1))}
function clampStage(v){return Math.max(0,Math.min(4,Number(v)||0))}
function stageIdx(s){return clampStage((s||S.session||{}).stage||0)}

/* Эталонная фраза привязана к этапу: баллы приносит только на своём этапе.
   quickPhrases могут храниться как строки (старый формат / импорт) — нормализуем в {s,stage}. */
function quickItem(p,fallbackStage){
  if(p&&typeof p==='object')return {s:p.s,stage:(p.stage!=null?Number(p.stage):fallbackStage),base:p.base};
  const idx=S.stages.findIndex(st=>(st.phrases||[]).indexOf(p)>=0);   // опорная фраза этапа — этап известен по списку
  return {s:p,stage:idx>=0?idx:fallbackStage};
}
/* Набор быстрых фраз для клиента на текущем этапе: сначала эталонные, при их отсутствии — опорные фразы этапа */
function quickPhrasesFor(clientId,stage){
  const raw=(S.quickPhrases&&S.quickPhrases[clientId])||[];
  const items=raw.map(p=>quickItem(p,stage));
  if(items.length)return items;
  const i=stageIdx(S.session);
  return ((S.stages[i]||{phrases:[]}).phrases||[]).map(p=>({s:p,stage:i,base:true}));
}
/* Привязка к контексту: фраза уместна только на своём этапе.
   Сравниваем численно и приводим текущий этап к индексу 0–4 (см. stageIdx). */
function quickFits(item,stage){
  if(!item)return {ok:true,why:''};
  if(item.base)return {ok:true,why:''};                              // опорная фраза этапа уместна по определению
  if(item.stage==null||item.stage==='')return {ok:true,why:''};
  const cur=clampStage(stage);
  if(Number(item.stage)!==cur)return {ok:false,why:'stage'};
  return {ok:true,why:''};
}

/* Эталонный диалог: базовый — из CLIENTS, отредактированный — из админки (S.etalons[clientId]).
   Формат реплики: {who:'you'|'cli', s:текст, stage:номер этапа или null}. */
function etalonOf(c){const a=(S.etalons||{})[c.id];return Array.isArray(a)?a:c.etalon}
/* Первая правка переносит эталон в состояние и раскладывает старую индексную разметку
   (S.stageEdits) по самим репликам — чтобы добавление и удаление не сдвигало этапы. */
function etalonSave(c){
  S.etalons=S.etalons||{};
  if(!Array.isArray(S.etalons[c.id])){
    S.etalons[c.id]=c.etalon.map((e,i)=>({who:e.who,s:e.s,stage:etalonStage(c,i)}));
    if(S.stageEdits&&S.stageEdits[c.id])delete S.stageEdits[c.id];
  }
  return S.etalons[c.id];
}
/* Этап реплики эталона с учётом правок методиста */
function etalonStage(c,i){
  const arr=etalonOf(c), e=arr?arr[i]:null;
  if(!e)return null;
  if(Array.isArray((S.etalons||{})[c.id]))return (e.stage!=null&&e.stage!=='')?clampStage(e.stage):null;
  const ed=(S.stageEdits||{})[c.id]||{};
  const v=(ed[i]!=null)?ed[i]:e.st;
  return (v==null||v==='')?null:clampStage(v);
}
/* Быстрые фразы клиента: каждая несёт свой этап (для проверки уместности) */
function buildQuickPhrases(c){
  const men=etalonOf(c).map((e,i)=>({e,i})).filter(x=>x.e.who==='you'&&((x.e.s||'').trim()));
  return men.map(({e,i})=>{
    // этап из разметки; если его нет — раскладываем по порядку: первая реплика → контакт, последняя → закрытие
    const st=etalonStage(c,i);
    return {s:e.s,stage:st!=null?st:(men.length>1?Math.round(men.findIndex(x=>x.e===e)*4/(men.length-1)):0)};
  });
}
/* У этапа нет ни одной эталонной фразы — методисту стоит это увидеть, а менеджеру ответить своими словами */
function stagesWithoutPhrases(c){
  const stages=buildQuickPhrases(c).map(p=>p.stage);
  return [0,1,2,3,4].filter(k=>stages.indexOf(k)<0);
}

/* Склонение числительных: 1 сессия / 2 сессии / 5 сессий */
function pl(n,one,few,many){const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20)return n+' '+many; if(b>1&&b<5)return n+' '+few; if(b===1)return n+' '+one; return n+' '+many}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='ic')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;

/* Техники под тип клиента: приоритет — правки методиста (S.tools), затем базовый набор
   этого типа (TYPE_TECH), затем три общих приёма. Пустой массив — блок на карточке скрыт. */
function toolsFor(c){
  const arr=(S.tools||{})[c.id];
  if(Array.isArray(arr))return arr;
  return TYPE_TECH[c.id]||TOOLS.slice(0,3);
}
function toolsEdit(c){S.tools=S.tools||{};if(!Array.isArray(S.tools[c.id]))S.tools[c.id]=toolsFor(c).map(t=>({...t}));return S.tools[c.id]}

/* ==================== 08. ДЕТЕКТОРЫ ПОВЕДЕНИЯ (механика 8) ============== */
const RE={
  negAck:/(не|ни|вряд ли)\s+(понимаю|согласен|согласна|правы|права|справедлив|логично|резонно|признаю|нормально)/,
  ack:/понимаю|согласен|вы правы|справедлив|резонно|логично|это нормально|признаю|наша вина|без оправдан|действительно так/,
  argue:/не так|неправы|ошибаетесь|не понимаете|вы не правы|мы лучшие|мы не хуже|это не проблема|ерунда|глупости|да вы что/,
  impose:/вам\s+(наверняка|наверное|скорее всего|же|надо|нужно|прид[её]тся|стоит)(\s+[а-яё]+){0,3}\s+(согласовать|обсудить|уточнить)|(надо|нужно|прид[её]тся|стоит)\s+согласовать|согласовать\s+(это\s+)?с\s+руководством|руководство\s+(же|наверняка|точно)|ваше руководство/,
  truth:/что именно смущает|что будет доказательством|будет доказательством|что для вас (важно|критично|ключев|принципиальн|важнее)|с чем сравниваете|что вас смущает|что мешает|что для вас (значит|означает)/,
  prevent:/понимаю, что вы|знаю, что обычно|часто слышу|наверняка у вас был|возможно, вы думаете/,
  others:/другие тоже|у других так же|другие говорили|тоже так считали/,
  yesand:/да, и|и при этом|при этом/,
  nextStep:/в (понедельник|вторник|среду|четверг|пятницу|субботу)|завтра|послезавтра|пришлю|отправлю|созвонимся|зафиксиру|договоримся|назначим|запишу|подготовлю к|разбер[её]м/,
  /* Прощание менеджера: раньше клиент на него не реагировал, и разговор
     уходил на второй и третий круг. Теперь это сигнал завершить звонок. */
  farewell:/до свидания|всего (доброго|хорошего|наилучшего)|всего вам|хорошего (дня|вечера)|приятного (дня|вечера)|удачного дня|до (встречи|связи|скорого|скорой)|будьте здоровы|спасибо за (время|удел[её]нное|беседу|разговор)/,
  concrete:/\d|процент|тысяч|млн|дней|часов|48|отсрочк|неустойк|sla|наличи|склад|резерв|выборк|брак|сезон|размерност|tco|стоимость владения|простой/,
  openQ:/^(как|что|чем|почему|зачем|какой|какие|сколько|когда|где|расскажите|опишите|уточните|поясните)(?![а-яё])/,  /* \b не работает после кириллицы */
  quickMark:null
};
function isOpenQuestion(t){
  const n=norm(t); if(!n.includes('?'))return false;
  const segs=n.split('?');
  return segs.some((p,i)=>{
    if(i===segs.length-1)return false;                        // берём сегменты, после которых стоит «?»
    const clauses=p.split(/[,.!;]/).map(x=>x.trim()).filter(Boolean);
    const q=clauses[clauses.length-1]; if(!q)return false;
    return RE.openQ.test(q)||/^(расскажите|опишите|уточните|поясните)/.test(q);
  });
}
function isQuestion(t){return norm(t).includes('?')}

/* Разбор реплики менеджера: детекции для критериев и промахов */
function analyze(text,ctx){
  const n=norm(text);
  const a={
    text, q:isQuestion(text), openQ:isOpenQuestion(text), closedQ:isQuestion(text)&&!isOpenQuestion(text),
    ack:!RE.negAck.test(n)&&RE.ack.test(n), argue:RE.argue.test(n), impose:RE.impose.test(n), truth:RE.truth.test(n),
    prevent:RE.prevent.test(n), others:RE.others.test(n), yesand:RE.yesand.test(n),
    nextStep:RE.nextStep.test(n), concrete:RE.concrete.test(n),
    fromQuick:!!ctx.fromQuick, llm:ctx.engine==='llm', words:text.trim().split(/\s+/).length
  };
  a.tools=[];
  if(a.ack)a.tools.push('ack');
  if(a.prevent)a.tools.push('prevent');
  if(a.others)a.tools.push('others');
  if(a.yesand)a.tools.push('yesand');
  if(a.truth)a.tools.push('truth');
  /* промахи — только поведенческие (механика 8), техника не наказывается (механика 7) */
  a.mistakes=[];
  if(ctx.interrupted)a.mistakes.push({k:'interrupt',d:'Перебивание: реплика отправлена, пока клиент говорил'});
  if(a.argue&&!a.ack)a.mistakes.push({k:'argue',d:'Спор/обесценивание вместо признания'});
  if(a.impose)a.mistakes.push({k:'impose',d:'Навязанное возражение за клиента'});
  if(!a.q&&!a.concrete&&!a.ack&&a.words<12)a.mistakes.push({k:'empty',d:'Общая фраза без конкретики и вопроса'});
  if(ctx.streak>=3&&!a.q)a.mistakes.push({k:'monolog',d:'Монолог 3+ реплик подряд без вопроса'});
  /* сдвиг настроя (механика 10) */
  let dm=0;
  if(a.openQ)dm+=8;
  if(a.ack)dm+=10;
  if(a.concrete)dm+=5;
  if(a.truth)dm+=6;
  if(a.nextStep)dm+=4;
  if(a.closedQ)dm+=2;
  if(a.argue&&!a.ack)dm-=15;
  if(a.impose)dm-=12;
  if(ctx.interrupted)dm-=12;
  if(a.mistakes.some(m=>m.k==='empty'))dm-=6;
  if(a.mistakes.some(m=>m.k==='monolog'))dm-=8;
  return {a,dm};
}
